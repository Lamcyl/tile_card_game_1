<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Tile Defense</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <canvas id="map" aria-label="World map. Drag to look around, tap a spot to select it."></canvas>
    <div id="hud" class="hud"></div>
    <div id="sheet" class="sheet"></div>

    <section id="battle" class="battle" hidden>
      <header class="b-head">
        <div class="b-title"><h2 id="b-name"></h2><small id="b-sub"></small></div>
        <div class="b-turn"><span>Turn</span> <b id="b-turn">1</b></div>
      </header>
      <div id="b-arena" class="arena">
        <div id="b-board" class="board"></div>
        <div class="threat-wrap">
          <div class="threat-label">If nothing dies, you take <b id="b-threat-total">0</b></div>
          <div id="b-threat" class="threat"></div>
        </div>
        <div id="b-hero" class="hero">
          <span class="hero-icon" aria-hidden="true">命</span>
          <div class="bar"><i id="b-hpfill"></i></div>
          <span id="b-hptext" class="hp-text"></span>
        </div>
        <div id="b-fx" class="fx"></div>
      </div>
      <p id="b-msg" class="b-msg"></p>
      <section id="b-log" class="b-log" aria-label="Battle log">
        <button id="b-log-toggle" type="button" aria-expanded="true">Battle log <span class="chev">▾</span></button>
        <div id="b-log-lines" class="log-lines" role="log"></div>
      </section>
      <div id="b-hand" class="hand"></div>
      <div class="b-controls">
        <button id="b-clear" type="button">Return all</button>
        <button id="b-speed" type="button" title="Animation speed">2×</button>
        <button id="b-fight" type="button" class="primary grow">⚔ Fight</button>
      </div>
    </section>

    <div id="modal" class="modal" hidden><div id="modal-box" class="modal-box"></div></div>
    <div id="toast" class="toast" hidden></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
