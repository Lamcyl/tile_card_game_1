<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tile Puzzle Sample</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>
:root{color-scheme:light dark;--cs:calc((min(100vw,440px) - 24px - 24px)/5);
 --bg:#eef1f5;--panel:#ffffff;--panel2:#e4e9f0;--ink:#1c2635;--muted:#566377;--line:#c9d1dc;--cellbg:#f8fafc;
 --r:#d2473f;--b:#2e6bd3;--g:#23874f;--ok:#1b8a4a;--bad:#c23a3a;--warn:#b86a00;--enemy:#33405a;--enemyink:#ffffff;
 --btn:#1c2635;--btnink:#ffffff;--shadow:rgba(20,30,50,.18);--okbg:#dff3e6;--badbg:#fbe3e3;--gold:#e0a100}
@media (prefers-color-scheme: dark){:root{
 --bg:#151a24;--panel:#212838;--panel2:#2b3448;--ink:#eef2f8;--muted:#a6b1c4;--line:#3a4560;--cellbg:#1b2130;
 --r:#e0584f;--b:#4f86e6;--g:#2f9d5f;--ok:#4cc27c;--bad:#ef6a6a;--warn:#e2a03a;--enemy:#3b4a69;--enemyink:#ffffff;
 --btn:#eef2f8;--btnink:#151a24;--shadow:rgba(0,0,0,.5);--okbg:#1f3a2c;--badbg:#412428;--gold:#f0b429}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
body{min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:0;cursor:pointer}
#app{width:100%;max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:0 12px 10px;display:flex;flex-direction:column}
.screen[hidden],[hidden]{display:none!important}
h1{margin:18px 0 2px;font-size:30px;letter-spacing:-.02em;color:var(--ink)}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.lvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lv{height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:14px;box-shadow:0 2px 0 var(--shadow)}
.lv b{font-size:26px;line-height:1;color:var(--ink)}.lv span{font-size:11px;color:var(--muted);max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv .stars,.stars{display:flex;gap:2px}.stars svg{width:15px;height:15px}
.star-on{fill:var(--gold);stroke:var(--gold)}.star-off{fill:none;stroke:var(--muted)}
.endless{margin-top:12px;width:100%;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--btn);color:var(--btnink);border-color:var(--btn);border-radius:14px;font-weight:700;font-size:17px}
.endless small{font-weight:500;font-size:12px;opacity:.85}
.linkbtn{margin:14px auto 0;display:block;background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;padding:8px}
header{display:flex;align-items:center;gap:8px;height:48px;flex:none}
.hbtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.hbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#title{flex:1;text-align:center;font-weight:800;font-size:17px;color:var(--ink)}
#hint{flex:none;min-height:34px;font-size:13px;line-height:1.3;color:var(--muted);text-align:center;padding:0 4px 4px}
#stage{position:relative;flex:none}
#enemies,#reacts{display:grid;grid-template-columns:repeat(5,var(--cs));gap:6px}
.enemy{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0}
.etile{position:relative;height:54px;border-radius:12px;background:var(--enemy);color:var(--enemyink);border:3px solid var(--enemy);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.etile b{font-size:28px;line-height:.95;font-weight:800;color:var(--enemyink);font-variant-numeric:tabular-nums}
.etile i{font-style:normal;font-size:8.5px;font-weight:800;letter-spacing:.06em;color:var(--enemyink);opacity:.85}
.etile svg.crack{position:absolute;inset:0;width:100%;height:100%;display:none}
.enemy.ok .etile{border-color:var(--ok)}
.enemy.over .etile,.enemy.fail .etile{border-color:var(--bad)}
.enemy.cracked .etile{background:var(--panel2);opacity:.75}.enemy.cracked .etile b,.enemy.cracked .etile i{color:var(--muted)}
.enemy.cracked svg.crack{display:block}.etile svg.crack path{stroke:var(--ink);opacity:.7}.enemy.cracked svg.crack path{stroke-dasharray:80;stroke-dashoffset:80;animation:draw .35s forwards}
.enemy.held .etile{animation:shake .45s}
.enemy.tgt .etile{outline:3px solid var(--gold);outline-offset:1px}
.pill{height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:14px;background:var(--panel2);color:var(--ink);border:2px solid var(--line);padding:0 6px;font-variant-numeric:tabular-nums}
.pill small{font-size:10px;font-weight:700;color:var(--muted)}
.enemy.ok .pill{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.enemy.ok .pill small{color:var(--ok)}
.enemy.over .pill,.enemy.fail .pill{background:var(--badbg);border-color:var(--bad);color:var(--bad)}.enemy.over .pill small,.enemy.fail .pill small{color:var(--bad)}
.pill svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#boardwrap{position:relative;margin-top:8px}
#board{display:grid;grid-template-columns:repeat(5,var(--cs));grid-template-rows:repeat(3,var(--cs));gap:6px}
.cell{position:relative;width:var(--cs);height:var(--cs);border-radius:12px;background:var(--cellbg);border:2px dashed var(--line);display:flex;align-items:center;justify-content:center}
.cell.off{background:transparent;border:2px dotted var(--line);opacity:.35}
.cell.x{border:2px solid var(--line);background:repeating-linear-gradient(45deg,var(--panel2) 0 6px,var(--cellbg) 6px 12px)}
.cell.occ{border:none;background:transparent}
.sel .cell.free{border-color:var(--ink);animation:glow 1.1s ease-in-out infinite}
.cell.aff{background:color-mix(in srgb,var(--gold) 38%,var(--cellbg));border-color:var(--gold);border-style:solid}
.cell.occ.aff .tile{outline:3px solid var(--gold);outline-offset:1px}
#links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.tile{position:relative;width:var(--cs);height:var(--cs);border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--tc);color:#fff;box-shadow:0 2px 0 var(--shadow);touch-action:none;cursor:grab}
.c-r{--tc:var(--r)}.c-b{--tc:var(--b)}.c-g{--tc:var(--g)}
.tile.k-boost{background:var(--panel);color:var(--tc);border:3px solid var(--tc)}
.tile.k-mod{background:var(--panel);color:var(--tc);border:3px dashed var(--tc)}
.tile .num{font-size:29px;line-height:1;font-weight:800;margin-top:-4px;font-variant-numeric:tabular-nums}
.tile.k-boost .num,.tile.k-mod .num{font-size:25px}
.tile .glyph{position:absolute;left:5px;top:5px;width:20px;height:20px}
.tile .sym{position:absolute;right:5px;top:5px;width:12px;height:12px}
.tile .nm{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-style:normal;font-size:9px;font-weight:800;letter-spacing:.05em}
.tile.boosted .nm,.tile.chg .nm{font-size:10.5px;bottom:3px}
.tile.dragging{opacity:.35}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-60%) scale(1.12);opacity:.92}
.pulse{animation:pulse .34s ease-out}
.flash-in{animation:pop .3s ease-out}
#info{flex:none;min-height:36px;font-size:13px;line-height:1.3;text-align:center;color:var(--ink);padding:6px 4px 2px}
#reacts{margin-top:6px;min-height:0}#reacts.has{min-height:54px}
.rcol{display:flex;flex-direction:row;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:3px}
.rchip{width:31px;height:25px;border-radius:9px;border:2px solid var(--panel);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 var(--shadow)}
.rchip svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rchip.steam{background:linear-gradient(90deg,var(--r) 50%,var(--b) 50%)}.rchip.blaze{background:linear-gradient(90deg,var(--r) 50%,var(--g) 50%)}.rchip.bloom{background:linear-gradient(90deg,var(--b) 50%,var(--g) 50%)}
.rname{font-size:9px;font-weight:800;color:var(--muted);letter-spacing:.04em}
#goals{flex:none;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px;min-height:26px}
.goal{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:2px 8px 2px 5px}
.goal svg{width:13px;height:13px}
.goal.live{border-color:var(--ok);color:var(--ok)}
#hand{display:grid;grid-template-columns:repeat(5,var(--cs));gap:6px;margin-top:6px;flex:none}
.slot{width:var(--cs);height:var(--cs);border-radius:12px}.slot.empty{border:2px dashed var(--line);opacity:.6}
.slot.sel .tile{outline:4px solid var(--ink);outline-offset:2px;transform:translateY(-3px)}
.slot .tile{transition:transform .12s}
#bar{display:flex;gap:10px;margin-top:auto;padding-top:10px;flex:none}
#bar button{height:50px;border-radius:14px;font-weight:800;font-size:17px}
#clear{flex:1}
#resolve{flex:2.2;background:var(--btn);color:var(--btnink);border-color:var(--btn)}
#resolve:disabled{opacity:.4;cursor:default}
#result{flex:none;margin-top:10px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center}
#result.win{border-color:var(--ok)}#result.lose{border-color:var(--bad)}
#result h2{margin:0 0 4px;font-size:22px;color:var(--ink)}
#result p,#result li{margin:2px 0;font-size:13px;color:var(--muted)}
#result ul{list-style:none;padding:0;margin:6px 0}
#result li.met{color:var(--ok);font-weight:700}#result li.bad{color:var(--bad);font-weight:600}
#result .stars{justify-content:center;gap:6px;margin:4px 0}#result .stars svg{width:30px;height:30px}
.rbtns{display:flex;gap:10px;margin-top:8px}.rbtns button{flex:1;height:46px;border-radius:12px;font-weight:800;font-size:16px}
.rbtns .main{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
#card,#help{position:fixed;left:50%;transform:translateX(-50%);z-index:60;width:min(340px,calc(100vw - 28px));background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:16px;padding:14px;box-shadow:0 8px 28px var(--shadow)}
#card{top:34%}
#card h3{margin:0 0 6px;font-size:17px;color:var(--ink)}#card p{margin:4px 0;font-size:14px;line-height:1.35;color:var(--ink)}
#card .muted,#help .muted{color:var(--muted);font-size:12px}
#card table{width:100%;border-collapse:collapse;font-size:13px}#card td{padding:2px 0;color:var(--ink)}#card td:last-child{text-align:right;font-weight:800}
#card .cardtile{float:left;margin:0 12px 4px 0}
#help{top:50%;transform:translate(-50%,-50%);max-height:88vh;overflow:auto;-webkit-user-select:text;user-select:text}
#help h3{margin:0 0 8px;font-size:19px;color:var(--ink)}#help ol{margin:0;padding-left:20px}#help li{margin:6px 0;font-size:14px;line-height:1.35;color:var(--ink)}
#help button{width:100%;height:44px;margin-top:10px;font-weight:800;background:var(--btn);color:var(--btnink);border-color:var(--btn)}
#help .rr{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px;color:var(--ink)}
#dim{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:55}
.fly{position:absolute;z-index:40;font-weight:900;font-size:19px;color:var(--ink);pointer-events:none;transform:translate(-50%,-50%);text-shadow:0 0 4px var(--bg),0 0 4px var(--bg),0 0 8px var(--bg);animation:fly .85s ease-in forwards}
.fly.boost{color:var(--warn)}
.shake{animation:shake .35s}
@keyframes fly{0%{opacity:0;transform:translate(-50%,-50%)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)))}}
@keyframes pulse{0%{transform:scale(1)}45%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.55}}
@media (max-height:760px){#hint{min-height:28px}.etile{height:48px}}

</style>
</head>
<body>
<div id="app">
  <div id="menu" class="screen">
    <h1>Tile Puzzle</h1>
    <p class="sub">Place tiles, resolve once. Beat every number.</p>
    <div class="lvgrid" id="lvgrid"></div>
    <button class="endless" id="endless"><span>Endless</span><small id="endbest">Random solvable puzzles</small></button>
    <button class="linkbtn" id="helpbtn">How to play</button>
  </div>
  <div id="game" class="screen" hidden>
    <header>
      <button class="hbtn" id="back" aria-label="Back to levels"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div id="title"></div>
      <button class="hbtn" id="helpbtn2" aria-label="How to play"><svg viewBox="0 0 24 24"><path d="M9 9a3 3 0 1 1 4.5 2.600c-1 .6-1.500 1.200-1.500 2.400M12 18v.5"/></svg></button>
    </header>
    <div id="hint"></div>
    <div id="stage">
      <div id="enemies"></div>
      <div id="boardwrap"><div id="board"></div><svg id="links"></svg></div>
      <div id="reacts"></div>
    </div>
    <div id="goals"></div>
    <div id="info"></div>
    <div id="hand"></div>
    <div id="result" hidden></div>
    <div id="bar"><button id="clear">Clear</button><button id="resolve">Resolve</button></div>
  </div>
  <div id="dim" hidden></div>
  <div id="help" hidden><h3>How to play</h3><div id="helpbody"></div><button id="helpclose">Got it</button></div>
  <div id="card" hidden></div>
</div>
<script>
/*RULES-START*/
var COLS = 5, ROWS = 3, NCELL = 15;
var SHAPES = {
  strike: { name: 'Strike', kind: 'attack', short: 'STRIKE', desc: 'Adds its number to its own column.' },
  fork:   { name: 'Fork',   kind: 'attack', short: 'FORK',   desc: 'Adds its number to the columns on its left and right, but not its own.' },
  plus:   { name: 'Plus',   kind: 'boost',  short: 'PLUS',   desc: 'Booster: adds +N to each Strike or Fork directly above, below, left or right of it.' },
  row:    { name: 'Row',    kind: 'boost',  short: 'ROW',    desc: 'Booster: adds +N to every Strike or Fork in its row.' },
  dbl:    { name: 'Double', kind: 'mod',    short: 'DOUBLE', desc: 'Doubles the tile directly above it (the one in front, nearer the enemy).' }
};
var COLORS = { r: 'Red', b: 'Blue', g: 'Green' };
var REACTS = {
  steam: { name: 'Steam', need: 'rb', cols: 'Red + Blue',  desc: 'Splash: +2 to both neighbouring columns.' },
  blaze: { name: 'Blaze', need: 'rg', cols: 'Red + Green', desc: '+3 to this column.' },
  bloom: { name: 'Bloom', need: 'bg', cols: 'Blue + Green', desc: 'Boosters in this column get +1.' }
};
function T(s, c, n) { return { s: s, c: c, n: n === undefined ? (s === 'dbl' ? 2 : 1) : n }; }
function tkey(t) { return t.s + t.c + t.n; }
function isAttack(t) { return t && SHAPES[t.s].kind === 'attack'; }
function isBoost(t) { return t && SHAPES[t.s].kind === 'boost'; }
function tileLabel(t) { return t.s === 'dbl' ? '×' + t.n : isBoost(t) ? '+' + t.n : String(t.n); }

/* Level prep: which columns are live, which cells usable. */
function prepLevel(L) {
  if (L._ok) return L;
  var live = [0, 0, 0, 0, 0], enemyAt = [-1, -1, -1, -1, -1];
  L.enemies.forEach(function (e, k) { for (var c = e.c; c < e.c + (e.w || 1); c++) { live[c] = 1; enemyAt[c] = k; } });
  var ok = [];
  for (var i = 0; i < NCELL; i++) ok[i] = !!live[i % COLS];
  (L.blocked || []).forEach(function (rc) { ok[rc[0] * COLS + rc[1]] = false; });
  L._ok = ok; L._live = live; L._enemyAt = enemyAt;
  L.feat = L.feat || {};
  return L;
}

/* board: array(15) of tile|null. Returns full evaluation. */
function evaluate(L, b, detail) {
  prepLevel(L);
  var F = L.feat, i, j, c, r;
  var chainB = [], seen = [], groups = [], maxChain = 0;
  for (i = 0; i < NCELL; i++) { chainB[i] = 0; seen[i] = 0; }
  for (i = 0; i < NCELL; i++) {
    if (!b[i] || seen[i]) continue;
    var grp = [i], k = 0; seen[i] = 1;
    while (k < grp.length) {
      var q = grp[k++], qr = (q / COLS) | 0, qc = q % COLS, nb = [];
      if (qr > 0) nb.push(q - COLS); if (qr < ROWS - 1) nb.push(q + COLS);
      if (qc > 0) nb.push(q - 1); if (qc < COLS - 1) nb.push(q + 1);
      for (var z = 0; z < nb.length; z++) { var w = nb[z]; if (!seen[w] && b[w] && b[w].c === b[i].c) { seen[w] = 1; grp.push(w); } }
    }
    if (grp.length > maxChain) maxChain = grp.length;
    if (F.chain && grp.length >= 3) { groups.push({ cells: grp, color: b[i].c }); for (z = 0; z < grp.length; z++) chainB[grp[z]] = grp.length - 2; }
  }
  /* columns: colours present and reactions fired */
  var fired = [], firedAt = [[], [], [], [], []], nFired = 0;
  for (c = 0; c < COLS; c++) {
    var has = {};
    for (r = 0; r < ROWS; r++) if (b[r * COLS + c]) has[b[r * COLS + c].c] = 1;
    for (var rk in REACTS) {
      var need = REACTS[rk].need;
      if (F[rk] && has[need.charAt(0)] && has[need.charAt(1)]) { firedAt[c].push(rk); fired.push({ col: c, name: rk }); nFired++; }
    }
  }
  var bloom = function (col) { return firedAt[col].indexOf('bloom') >= 0 ? 1 : 0; };
  /* doubles */
  var mult = [];
  for (i = 0; i < NCELL; i++) mult[i] = 1;
  for (i = COLS; i < NCELL; i++) if (b[i] && b[i].s === 'dbl' && b[i - COLS] && b[i - COLS].s !== 'dbl') mult[i - COLS] = b[i].n;
  /* boosters */
  var boost = [], power = [];
  for (i = 0; i < NCELL; i++) { boost[i] = 0; power[i] = 0; }
  for (i = 0; i < NCELL; i++) {
    var t = b[i]; if (!t || !isBoost(t)) continue;
    var p = (t.n + chainB[i] + bloom(i % COLS)) * mult[i]; power[i] = p;
    r = (i / COLS) | 0; c = i % COLS;
    var tg = [];
    if (t.s === 'plus') { if (r > 0) tg.push(i - COLS); if (r < ROWS - 1) tg.push(i + COLS); if (c > 0) tg.push(i - 1); if (c < COLS - 1) tg.push(i + 1); }
    else { for (j = r * COLS; j < r * COLS + COLS; j++) if (j !== i) tg.push(j); }
    for (var y = 0; y < tg.length; y++) if (isAttack(b[tg[y]])) boost[tg[y]] += p;
  }
  /* attacks */
  var tot = [0, 0, 0, 0, 0], src = [0, 0, 0, 0, 0], val = [];
  var lines = detail ? [[], [], [], [], []] : null;
  for (i = 0; i < NCELL; i++) {
    var a = b[i]; if (!a || !isAttack(a)) continue;
    c = i % COLS;
    var v = (a.n + chainB[i] + boost[i]) * mult[i]; val[i] = v;
    var outs = a.s === 'strike' ? [c] : [c - 1, c + 1];
    for (var o = 0; o < outs.length; o++) {
      var oc = outs[o]; if (oc < 0 || oc >= COLS) continue;
      tot[oc] += v; src[oc]++;
      if (detail) {
        var parts = a.n + ' base' + (chainB[i] ? ' +' + chainB[i] + ' chain' : '') + (boost[i] ? ' +' + boost[i] + ' boost' : '') + (mult[i] > 1 ? ' ×' + mult[i] : '');
        lines[oc].push({ t: (a.s === 'fork' && oc !== c ? 'Fork from col ' + (c + 1) : 'Strike') + ' (' + parts + ')', a: v });
      }
    }
  }
  for (c = 0; c < COLS; c++) {
    firedAt[c].forEach(function (rk) {
      if (rk === 'blaze') { tot[c] += 3; if (detail) lines[c].push({ t: 'Blaze reaction', a: 3 }); }
      if (rk === 'steam') [c - 1, c + 1].forEach(function (n) { if (n >= 0 && n < COLS) { tot[n] += 2; if (detail) lines[n].push({ t: 'Steam splash from col ' + (c + 1), a: 2 }); } });
      if (rk === 'bloom' && detail) lines[c].push({ t: 'Bloom: boosters here +1', a: 0 });
    });
  }

/* ---------- pointer handling ---------- */

/* ---------- resolve animation ---------- */

  el.style.setProperty('--dx', (to.x - from.x) + 'px'); el.style.setProperty('--dy', (to.y - from.y) + 'px');

    box.className = 'win';

    if (!S.endless) {

        '<li class="met">Win the puzzle</li>' + L.goals.map(function (g, k) { return '<li class="' + (goalsMet[k] ? 'met' : '') + '">' + (goalsMet[k] ? 'Done: ' : 'Try: ') + goalText(g) + '</li>'; }).join('') + '</ul>';

/* ---------- buttons ---------- */

});

})();
