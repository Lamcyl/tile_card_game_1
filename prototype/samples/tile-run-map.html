*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:440px;margin:0 auto;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:0;cursor:pointer}
/* mockup chrome */
#tabs{display:flex;gap:4px;padding:6px 8px 0;flex:none}
#tabs button{flex:1;height:36px;border-radius:10px;font-size:12px;font-weight:800;border-width:2px;line-height:1.05;padding:0 2px;box-shadow:0 2px 0 var(--shadow)}
#tabs button[aria-selected=true]{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
#desc{flex:none;padding:5px 14px 4px;font-size:11px;line-height:1.3;color:var(--muted);height:36px;overflow:hidden}
#desc b{color:var(--ink)}
/* app */
#app{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;padding:0 12px 10px}
.hd{display:flex;align-items:center;gap:8px;height:42px;flex:none}
.hd h1{margin:0;font-size:21px;letter-spacing:-.02em;flex:1}
.coinp{display:flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:16px;background:var(--panel);box-shadow:0 2px 0 var(--shadow);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.coinp::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--gold)}
.ib{width:44px;height:40px;border-radius:14px;box-shadow:0 2px 0 var(--shadow);display:flex;align-items:center;justify-content:center;border:0}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#mapbox{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:16px;background:var(--panel);border:2px solid var(--line);overflow:hidden;position:relative}
#scr{flex:1;min-height:0;overflow:auto;padding:8px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pager{flex:none;display:flex;align-items:center;gap:6px;padding:4px 6px;border-bottom:2px solid var(--line);background:var(--panel)}
.pager b{flex:1;text-align:center;font-size:14px}.pager small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.pager button{width:44px;height:36px;border-radius:12px;box-shadow:0 2px 0 var(--shadow);font-weight:800;font-size:16px}
.pager button:disabled{opacity:.35}
.dots{display:flex;gap:5px;justify-content:center;margin-top:2px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--btn)}
.board{position:relative;margin:0 auto}
/* stage pieces: mosaics of terrain tiles */
.pc{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.pc.c{filter:drop-shadow(0 2px 0 var(--shadow))}
.pc.s{z-index:6;filter:drop-shadow(0 3px 0 var(--shadow))}
.pc.a{z-index:2}
.cl{position:absolute;pointer-events:auto;cursor:pointer;border:0 solid transparent;background-repeat:no-repeat;background-origin:border-box;touch-action:manipulation}
.pc.c .cl{border-color:rgba(255,255,255,.75);border-style:solid}
.pc.a .cl{border-color:var(--muted);border-style:dashed;filter:saturate(.45) brightness(1.1);opacity:var(--dim);background-blend-mode:normal}
.pc.s .cl{border-color:var(--btn);border-style:solid}
.pc.s.isa .cl{filter:none;opacity:1}
.blank{position:absolute;background:var(--hid);pointer-events:none;border:1.5px dashed color-mix(in srgb,var(--line) 70%,transparent)}
.pad{position:absolute;background:color-mix(in srgb,var(--hid) 80%,transparent);border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:800;font-size:18px;pointer-events:none;backdrop-filter:blur(1px)}
.lm{position:absolute;pointer-events:none}
.lm i{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);background-repeat:no-repeat;background-position:center bottom;background-size:contain;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.pc.a .lm i{opacity:.55;filter:grayscale(.6)}
.bd{position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.bd svg{width:11px;height:11px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.bd.go{background:var(--btn);width:22px;height:22px;right:2px;top:2px}
.bd.go svg{fill:var(--btnink);stroke:none;width:10px;height:10px;margin-left:1px}
.tt{position:absolute;background-repeat:no-repeat}.pth .tt{filter:saturate(.75) brightness(.82)}.pth .pc.c .cl{border-color:rgba(255,255,255,.6)}
.rd{position:absolute;background-repeat:no-repeat;box-shadow:inset 0 0 0 2px rgba(120,80,40,.28)}
.prp{position:absolute;pointer-events:none;background-repeat:no-repeat;background-position:center bottom;background-size:contain;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.mfog{position:absolute;left:0;right:0;pointer-events:none;z-index:9}
:root{--dk:1}@media (prefers-color-scheme: dark){.isle{filter:brightness(.8)}.cl,.tt,.rd{filter:brightness(.78)}.pc.a .cl{filter:saturate(.45) brightness(.8)}.prp,.lm i{filter:brightness(.85)}}
/* islands, bridges, bands */
.isle{position:relative;padding:8px;border-radius:26px;background:var(--rim,var(--rimA));box-shadow:0 7px 0 color-mix(in srgb,var(--rim,var(--rimA)) 62%,#000),0 14px 14px -6px var(--shadow)}
.isle .inner{position:relative;border-radius:19px;background:color-mix(in srgb,var(--rim,var(--rimA)) 45%,var(--panel));overflow:visible}
.isle.fogd{opacity:.5;box-shadow:none}
.brg{position:relative;height:30px;flex:none}
.brg{z-index:0}.isle{z-index:1}.brg i{position:absolute;left:0;right:0;top:-10px;bottom:-10px;border-radius:3px;background:repeating-linear-gradient(#c79a5e 0 5px,#8a6238 5px 6.5px);border:2px solid #6b4a2c;border-width:0 2px}
.brg.off i{background:none;border:2px dashed var(--line);opacity:.8}
.bandh{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;color:var(--muted);padding:6px 4px 3px;text-transform:uppercase;letter-spacing:.04em}
.bandh span:last-child{text-transform:none;letter-spacing:0;font-weight:700}
.grp{position:relative;margin-bottom:8px;padding:0 0 0 24px}
.grp .rail{position:absolute;left:0;top:0;bottom:0;width:20px;border-radius:8px;background:var(--panel2);color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;white-space:nowrap}
.dsh{position:absolute;border:2px dashed var(--line);border-radius:10px;pointer-events:none}
/* card, play, dock */
#card{flex:none;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px 12px 9px;box-shadow:0 2px 0 var(--shadow)}
#card .c1{display:flex;align-items:center;gap:8px}
#card .c1 b{font-size:17px;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:9px;background:var(--panel2);color:var(--muted)}.tag.c{background:color-mix(in srgb,var(--ok) 18%,var(--panel));color:var(--ok)}
#card .c2{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);font-weight:700;margin:1px 0 6px}
#card .c2 .sw{width:16px;height:16px;border-radius:5px;background-size:cover;border:1.5px solid var(--line);flex:none}
.pips{display:inline-flex;gap:3px;align-items:center}.pips i{width:7px;height:7px;border-radius:2px;background:var(--line)}.pips i.on{background:var(--ink)}
#card .c3{display:flex;gap:6px}
.chip{flex:1;min-width:0;background:var(--bg);border-radius:10px;padding:3px 8px 4px}
.chip small{display:block;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.chip b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bigbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;height:54px;border-radius:18px;background:var(--btn);color:var(--btnink);border:0;box-shadow:0 5px 0 color-mix(in srgb,var(--btn) 55%,#000);flex:none;font-size:21px;font-weight:800;margin-bottom:3px}
.bigbtn small{font-size:11px;font-weight:600;opacity:.75;line-height:1}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--btn)}
.dock5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:none}
.dk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:54px;border-radius:14px;background:var(--panel);box-shadow:0 3px 0 var(--shadow);font-size:11px;font-weight:800;color:var(--ink);border:0;padding:2px 0}
.dk .m{width:26px;height:26px;border-radius:9px;background:var(--c,var(--x));color:#fff;display:flex;align-items:center;justify-content:center}
.dk .m svg{width:16px;height:16px}
</style>
</head>

  <button class="dk"><span class="m"><svg class="i" viewBox="0 0 24 24"><path d="M7 8c-3 0-4 2-4 4s1 4 4 4c4 0 6-8 10-8 3 0 4 2 4 4s-1 4-4 4c-4 0-6-8-10-8z"/></svg></span>Endless</button>
  <button class="dk"><span class="m" style="--c:var(--p)"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg></span>Hero</button>
  <button class="dk"><span class="m" style="--c:var(--b)"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6M15 15c3 0 6 1 6 5"/></svg></span>Team</button>
  <button class="dk"><span class="m"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg></span>More</button>
 </div>
</div>
<script>
var $=function(s){return document.querySelector(s)};
var REG={mea:{n:4,pr:['oak','bush','boul','oak'],rim:'#b9c78b'},wod:{n:4,pr:['pine','cedar','mush','boul','pine'],rim:'#9db37e'},mar:{n:4,pr:['bush','mush','boul','bush'],rim:'#92b3a2'},des:{n:4,pr:['palm','cact','spire'],rim:'#dcc08a'},slt:{n:3,pr:['spire','boul'],rim:'#d7d3c8'},lav:{n:3,pr:['spire','boul'],rim:'#a89a9a'}};
var AR=[{n:'Greenvale Meadows',reg:'mea',d:1,dn:'Easy',st:'ABCD'},{n:'Old Oak Wood',reg:'wod',d:2,dn:'Fair',st:'EFGH'},{n:'Firefly Marsh',reg:'mar',d:3,dn:'Tricky',st:'IJK'},{n:'Red Wadi',reg:'des',d:4,dn:'Hard',st:'LMN'},{n:'Salt Mirror',reg:'slt',d:5,dn:'Brutal',st:'OPQR'},{n:'Sun Citadel',reg:'lav',d:6,dn:'Mythic',st:'STU'}];
var ST={};AR.forEach(function(a,ai){a.st.split('').forEach(function(L,i){ST[L]={ai:ai,i:i,last:i===a.st.length-1}})});
var STATE={A:'c',B:'c',C:'c',D:'c',E:'c',F:'c',G:'a',I:'a'};
var NAMES={A:'Dewdrop Field',B:'Clover Hill',C:'Hay Lane',D:'Meadow Gate',E:'Acorn Trail',F:'Lantern Glade',G:'Mossy Hollow',H:'Old Oak Hall',I:'Glow Shallows',J:'Reed Maze',K:'Mudbank Keep'};
var TRICK=['No trick','Armoured: -1 to attacks','Mirror: copies your last tile','Shield: blocks the first hit','Swarm: two small foes','Regrow: heals each round'];
var TRSH=['None','Armoured','Mirror','Shield','Swarm','Regrow'];
var DROPS=['12 coins','12 coins, 1 shard','1 tile','2 shards','Rare tile','30 coins'];
var LM={A:'well',B:'oak',C:'stall',D:'torii',E:'cedar',F:'lant',G:'hut',H:'torii',I:'mush',J:'bush',K:'chest'};
var TALL={oak:1,pine:1,cedar:1,lant:1,palm:1,cact:1,spire:1,col:1},BIG={torii:1,hut:1,stall:1};
var S={tab:0,sel:'G',pa:1};
function st(L){return STATE[L]||'h'}
function isL(l){return /[A-Z]/.test(l)}
function ai(l){return isL(l)?ST[l].ai:-1}
function hash(x,y,m){return ((x*73856093)^(y*19349663)^(x*y*83492791))>>>0}
function propBox(k,c){return TALL[k]?[c*.75,c*1.2]:BIG[k]?[c*1.2,c*1.0]:[c*.7,c*.7]}
/* mosaic of polyomino stage pieces made of terrain tiles; G is an array of strings, A-U are stages, . empty, = road */
function mosaic(G,o){
 var R=G.length,C=G[0].length,c=o.c,h='',gr={};
 function ch(x,y){return y<0||y>=R||x<0||x>=C?'#':G[y][x]}
 for(var y=0;y<R;y++)for(var x=0;x<C;x++){var l=G[y][x];if(isL(l))(gr[l]=gr[l]||[]).push([x,y])}
 function gap(l,n){if(n===l)return 0;if(n==='#')return o.gOut;if(n==='=')return o.gRoad;if(n==='.')return o.gDot;return ai(n)===ai(l)?o.g1:o.g2}
 Object.keys(gr).forEach(function(l){
  var cells=gr[l],s=st(l),a=ST[l].ai,reg=AR[a].reg,sel=(l===S.sel&&s!=='h');
  if(s==='h'){
   var fo=o.fog?o.fog(a):1;
   if(o.hid==='pad'){var x0=99,y0=99,x1=0,y1=0;cells.forEach(function(p){x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])});
    h+='<div class="pad" style="left:'+(x0*c+2)+'px;top:'+(y0*c+2)+'px;width:'+((x1-x0+1)*c-4)+'px;height:'+((y1-y0+1)*c-4)+'px;border-radius:'+o.rad+'px;opacity:'+fo+'">?</div>';}
   else cells.forEach(function(p){var q=o.gb||2;h+='<div class="blank" style="left:'+(p[0]*c+q)+'px;top:'+(p[1]*c+q)+'px;width:'+(c-2*q)+'px;height:'+(c-2*q)+'px;border-radius:'+Math.round(o.rad*.7)+'px;opacity:'+fo+'"></div>'});
   return;}
  var set={},mx=0,my=0;cells.forEach(function(p){mx+=p[0];my+=p[1]});mx/=cells.length;my/=cells.length;
  var best=null,bd=1e9;cells.forEach(function(p){var d=(p[0]-mx)*(p[0]-mx)+(p[1]-my)*(p[1]-my);if(d<bd){bd=d;best=p}});
  var bw=sel?3:s==='a'?2:(o.bwc||1.5),k=REG[reg].n;
  h+='<div class="pc '+(sel?'s':s)+'">';
  cells.forEach(function(p){var x=p[0],y=p[1],nl=ch(x-1,y),nr=ch(x+1,y),nt=ch(x,y-1),nb=ch(x,y+1);
   var L=gap(l,nl),Rr=gap(l,nr),T=gap(l,nt),B=gap(l,nb),r=o.rad,sm=2;
   var tl=nl!==l&&nt!==l?r:sm,tr=nr!==l&&nt!==l?r:sm,br=nr!==l&&nb!==l?r:sm,bl=nl!==l&&nb!==l?r:sm;
   var t=(hash(x,y)%k)+1;
   h+='<div class="cl" data-l="'+l+'" style="left:'+(x*c+L)+'px;top:'+(y*c+T)+'px;width:'+(c-L-Rr)+'px;height:'+(c-T-B)+'px;background-image:var(--t-'+reg+t+');background-size:'+c+'px '+c+'px;background-position:'+(-L)+'px '+(-T)+'px;border-radius:'+tl+'px '+tr+'px '+br+'px '+bl+'px;border-width:'+(nt!==l?bw:0)+'px '+(nr!==l?bw:0)+'px '+(nb!==l?bw:0)+'px '+(nl!==l?bw:0)+'px"></div>'});
  var pk=o.lm&&o.lm[l];
  h+='<div class="lm" style="left:'+best[0]*c+'px;top:'+best[1]*c+'px;width:'+c+'px;height:'+c+'px">';
  if(pk){var pb=propBox(pk,c*(o.ps||1));h+='<i style="width:'+pb[0]+'px;height:'+pb[1]+'px;background-image:var(--p-'+pk+')"></i>'}
  if(s==='c')h+='<span class="bd"><svg viewBox="0 0 12 12"><path d="M2 6.5l3 3 5-7"/></svg></span>';
  else if(sel)h+='<span class="bd go"><svg viewBox="0 0 10 10"><path d="M1 0l9 5-9 5z"/></svg></span>';
  h+='</div></div>';
 });
 return h;
}
function sizeBoard(cols,rows,c,inner){return '<div class="board" style="width:'+cols*c+'px;height:'+rows*c+'px">'+inner+'</div>'}
function cw(){return $('#scr').clientWidth-16}
/* 1 jigsaw */
var G1=['LLLLMMNNN','LLLMMMNNN','KKKKJJJJJ','KKKIIIJJJ','KKIIIIIJJ','HHHHGGGGG','HHHGGGGGG','FFFFGGGEE','FFFFFFEEE','FFFEEEEEE','CCCCDDDDD','CCCBBDDDD','CCBBBBDDD','AABBBBBDD','AAAABBBBD'];
function T1(){var c=Math.floor(cw()/9);return sizeBoard(9,15,c,mosaic(G1,{c:c,g1:1.5,g2:6,gOut:2,gDot:2,gRoad:0,rad:Math.round(c*.3),lm:LM,fog:function(a){return a<=2?1:a===3?.55:.3}}))}
/* 2 path map: one area per screenful */
var PA=[
 {g:['.DDDD...','.DDDD...','..=.....','..=CCC..','..=CCC..','..=.....','BBB==...','BBB.AAA.','....AAA.'],gate:true},
 {g:['........','.HHHH...','.HHHH...','..=.....','..=GGGG.','..=GGGG.','FFF=....','FFF=EEE.','....EEE.']},
 {g:['........','..KKKK..','..KKKK..','...=....','JJJ=....','JJJ=....','...=....','..III...','..III...'],fog:true}];
function T2(){
 var a=S.pa,P=PA[a],reg=AR[a].reg,rg=REG[reg],G=P.g,c=Math.floor(cw()/8),R=G.length,C=8,h='';
 function ch(x,y){return y<0||y>=R||x<0||x>=C?'#':G[y][x]}
 for(var y=0;y<R;y++)for(var x=0;x<C;x++){var l=G[y][x];
  if(true){var t0=(hash(x,y)%rg.n)+1;h+='<div class="tt" style="left:'+x*c+'px;top:'+y*c+'px;width:'+c+'px;height:'+c+'px;background-image:var(--t-'+reg+t0+');background-size:'+c+'px"></div>';}}
 for(y=0;y<R;y++)for(x=0;x<C;x++){l=G[y][x];
  if(l==='='){var con=function(xx,yy){var q=ch(xx,yy);return q==='='||(isL(q)&&st(q)!=='h')};
   var r=Math.round(c*.42),tl=!con(x-1,y)&&!con(x,y-1)?r:3,tr=!con(x+1,y)&&!con(x,y-1)?r:3,br=!con(x+1,y)&&!con(x,y+1)?r:3,bl=!con(x-1,y)&&!con(x,y+1)?r:3;
   h+='<div class="rd" style="left:'+x*c+'px;top:'+y*c+'px;width:'+c+'px;height:'+c+'px;background-image:var(--t-'+(reg==='mar'?'mar3':'dirt')+');background-size:'+c+'px;border-radius:'+tl+'px '+tr+'px '+br+'px '+bl+'px"></div>';}}
 for(y=0;y<R;y++)for(x=0;x<C;x++){if(G[y][x]!=='.')continue;var hv=hash(x*3,y*7)%100;
  if(hv<30){var k=rg.pr[hash(x,y+5)%rg.pr.length],pb=propBox(k,c*.95);h+='<div class="prp" style="left:'+(x*c+(c-pb[0])/2)+'px;top:'+(y*c+c-pb[1]-2)+'px;width:'+pb[0]+'px;height:'+pb[1]+'px;background-image:var(--p-'+k+')"></div>'}}
 h+=mosaic(G,{c:c,g1:1,g2:1,gOut:0,gRoad:0,gDot:0,rad:9,lm:LM,ps:1,hid:'pad',bwc:2});
 h+='<div class="mfog" style="top:0;height:'+c*.7+'px;background:linear-gradient(var(--fog),transparent)"></div><div class="mfog" style="bottom:0;height:'+c*.7+'px;background:linear-gradient(transparent,var(--fog))"></div>';
 if(P.fog)h+='<div class="mfog" style="top:0;bottom:0;background:var(--fog);opacity:.4"></div>';
 var pg='<div class="pager"><button data-d="-1" aria-label="Previous area"'+(a===0?' disabled':'')+'>&#8249;</button><b>'+AR[a].n+'<div class="dots">'+[0,1,2].map(function(i){return '<i'+(i===a?' class="on"':'')+'></i>'}).join('')+'</div></b><button data-d="1" aria-label="Next area"'+(a===2?' disabled':'')+'>&#8250;</button></div>';
 $('#pgr').innerHTML=pg;
 return sizeBoard(8,R,c,h).replace('class="board"','class="board pth"');
}
/* 3 islands */
var IS=[{ai:0,g:['CCDDDD','CCCDDD','AABBDD','AABBBB']},{ai:1,g:['HHHGGG','HHGGGG','FFFEEE','FFFFEE']},{ai:2,g:['KKJJJ','KIIJJ','IIIJJ']},{ai:3,g:['LLMMM','LMMNN','NNNNN']}];
function T3(){
 var w=cw(),c=Math.floor((w-64)/6),h='<div style="display:flex;flex-direction:column;align-items:flex-start;padding-top:4px">',offs=[],wid=[];
 var list=IS.slice().reverse();
 list.forEach(function(I,j){var cols=I.g[0].length,Wi=cols*c+16;wid.push(Wi);offs.push(I.ai%2?w-Wi:0)});
 list.forEach(function(I,j){
  var reg=AR[I.ai].reg,cols=I.g[0].length,rows=I.g.length,inner=sizeBoard(cols,rows,c,mosaic(I.g,{c:c,g1:2,g2:2,gOut:1.5,gDot:1,gRoad:0,rad:Math.round(c*.3),lm:LM,fog:function(){return 1}}));
  h+='<div class="isle'+(I.ai>2?' fogd':'')+'" style="margin-left:'+offs[j]+'px;--rim:'+REG[reg].rim+'"><div class="inner">'+inner.replace('class="board" style="','class="board" style="margin:0;')+'</div></div>';
  if(j<list.length-1){var nxt=list[j+1],lo=Math.max(offs[j],offs[j+1]),hi=Math.min(offs[j]+wid[j],offs[j+1]+wid[j+1]),bx=lo+Math.min(60,(hi-lo)/2-9),open=I.ai-1<0?true:isCleared(I.ai-1);
   h+='<div class="brg'+(isCleared(nxt.ai)?'':' off')+'" style="margin-left:'+bx+'px;width:18px"><i></i></div>';}
 });
 return h+'</div>';
}
function isCleared(a){return AR[a].st.split('').every(function(l){return st(l)==='c'})}
/* 4 strip world */
var BANDS=[['AAABBCCC','AAABBCDD','AAABBCDD'],['EEFFFFGG','EEFHHHGG','EEFHHHGG'],['IIJJJJKK','IIJJJJKK','IIIJJKKK'],['LLMMMNNN','LLMMMNNN','LLMMMNNN']];
function T4(){
 var c=Math.floor(cw()/8),h='';
 for(var a=3;a>=0;a--){var done=AR[a].st.split('').filter(function(l){return st(l)==='c'}).length;
  h+='<div class="bandh"><span>Area '+(a+1)+(a<3?' &middot; '+AR[a].n:' &middot; ???')+'</span><span>'+(a<3?done+' of '+AR[a].st.length+' cleared':'locked')+'</span></div>';
  var m=mosaic(BANDS[a],{c:c,g1:2.5,g2:2.5,gOut:2,gDot:2,gRoad:0,rad:Math.round(c*.32),lm:LM,ps:.8,fog:function(){return .5}});
  h+=sizeBoard(8,3,c,m).replace('class="board"','class="board" data-band="'+a+'"');}
 return h;
}
/* 5 board as map */
var BG=[['AAAAB','CC.BB','CCDDB','...DD'],['EEEFF','.E.FF','GGGHH','G..HH'],['KKKJJ','K...J','IIxxJ','.IIxx']];
function T5(){
 var c=Math.floor((cw()-26)/5),h='';
 for(var a=2;a>=0;a--){
  var G=BG[a].map(function(r){return r.replace(/x/g,'.')}),m='';
  for(var y=0;y<4;y++)for(var x=0;x<5;x++){if(G[y][x]!=='.')continue;
   if(a===2||(a===1&&0)){m+='<div class="blank" style="left:'+(x*c+3)+'px;top:'+(y*c+3)+'px;width:'+(c-6)+'px;height:'+(c-6)+'px;border-radius:10px"></div>'}
   else m+='<div class="tt" style="left:'+(x*c+3)+'px;top:'+(y*c+3)+'px;width:'+(c-6)+'px;height:'+(c-6)+'px;border-radius:10px;opacity:.3;background-image:var(--t-'+AR[a].reg+((hash(x,y)%REG[AR[a].reg].n)+1)+');background-size:'+c+'px;background-position:-3px -3px"></div>'}
  m+=mosaic(G,{c:c,g1:3,g2:3,gOut:3,gDot:3,gRoad:3,rad:11,gb:3,lm:LM,ps:.8,fog:function(){return 1}});
  h+='<div class="grp"><div class="rail">'+(a<3?AR[a].n:'')+'</div>'+sizeBoard(5,4,c,m).replace('class="board" style="','class="board" style="margin:0;')+'</div>';}
 return h;
}
var TABS=[
 {k:'Jigsaw',a:'Idea: areas are clusters of interlocking terrain pieces.',b:'Cost: dense and big; pieces crowd, needs panning.',f:T1},
 {k:'Path',a:'Idea: one area per screen, landmarks on a road, swipe on.',b:'Cost: closest to defence, but little world overview.',f:T2},
 {k:'Islands',a:'Idea: each area an island, bridges appear when cleared.',b:'Cost: clear progress story, uses more scroll height.',f:T3},
 {k:'Strip',a:'Idea: one band per area, pieces pack it like a tower.',b:'Cost: tidy and compact, shapes limited to a rectangle.',f:T4},
 {k:'Board',a:'Idea: 5-column board, stages are the game\'s own shapes.',b:'Cost: teaches the grid, but least landscape feel.',f:T5}];
function card(){
 var L=S.sel,s=ST[L],a=AR[s.ai],n=s.i,len=4+a.d+n,tr=(n*2+a.d)%6,dr=(n+a.d*2)%6;
 var isb=s.last,state=st(L)==='c'?'Cleared':'Available';
 var pips='';for(var i=1;i<=6;i++)pips+='<i'+(i<=a.d?' class="on"':'')+'></i>';
 $('#card').innerHTML='<div class="c1"><b>'+NAMES[L]+'</b><span class="tag'+(state==='Cleared'?' c':'')+'">'+state+'</span></div>'+
  '<div class="c2"><span class="sw" style="background-image:var(--t-'+a.reg+'1)"></span>'+a.n+' &middot; '+a.dn+' <span class="pips" aria-label="difficulty '+a.d+' of 6">'+pips+'</span></div>'+
  '<div class="c3"><div class="chip"><small>Length</small><b>'+len+' fights</b></div><div class="chip" title="'+TRICK[tr]+'"><small>'+(isb?'Boss trick':'Trick')+'</small><b>'+TRSH[tr]+'</b></div><div class="chip"><small>Drops</small><b>'+DROPS[dr]+'</b></div></div>';
 $('#play').innerHTML='<span>'+(state==='Cleared'?'Replay':'Play')+'</span><small>'+NAMES[L]+'</small>';
}
function render(keep){
 var sc=$('#scr'),top=sc.scrollTop;$('#pgr').innerHTML='';
 var t=TABS[S.tab];sc.innerHTML=t.f();
 $('#tabs').innerHTML=TABS.map(function(x,i){return '<button role="tab" aria-selected="'+(i===S.tab)+'" data-t="'+i+'">'+(i+1)+' '+x.k+'</button>'}).join('');
 $('#desc').innerHTML='<b>'+t.a.split(': ')[0]+':</b> '+t.a.split(': ').slice(1).join(': ')+'<br><b>'+t.b.split(': ')[0]+':</b> '+t.b.split(': ').slice(1).join(': ');
 card();
 if(keep)sc.scrollTop=top;else{var e=sc.querySelector('.pc.s .lm');if(e){var r=e.getBoundingClientRect(),q=sc.getBoundingClientRect();sc.scrollTop=sc.scrollTop+(r.top+r.height/2)-(q.top+q.height/2)}}
}
document.addEventListener('click',function(e){
 var b=e.target.closest('button'),cl=e.target.closest('.cl');
 if(b&&b.dataset.t!==undefined){S.tab=+b.dataset.t;render(false);return}
 if(b&&b.dataset.d){S.pa=Math.max(0,Math.min(2,S.pa+ +b.dataset.d));var ls=AR[S.pa].st.split(''),f=ls.filter(function(l){return st(l)==='a'})[0]||ls.filter(function(l){return st(l)==='c'}).pop();S.sel=f;render(false);return}
 if(cl){S.sel=cl.dataset.l;S.pa=ST[S.sel].ai;render(true)}
});
render(false);

</script>
</body>
