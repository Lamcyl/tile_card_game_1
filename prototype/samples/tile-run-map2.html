<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tile Run - map layouts, round two (no art)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>
:root{color-scheme:light dark;
 --bg:#eef1f5;--panel:#ffffff;--panel2:#e4e9f0;--ink:#1c2635;--muted:#566377;--line:#c9d1dc;
 --r:#d2473f;--b:#2e6bd3;--g:#23874f;--y:#b9800f;--p:#7a55c2;
 --rt:#d2473f;--bt:#2e6bd3;--gt:#23874f;--yt:#8a6500;--pt:#7a55c2;
 --btn:#1c2635;--btnink:#ffffff;--shadow:rgba(20,30,50,.18);--gold:#e0a100;--shard:#2f9fd0;--goldbg:#fbefc8;--goldink:#6b4a00;
 --slab:#26344f;--slab2:#31415f}
@media (prefers-color-scheme: dark){:root{
 --bg:#151a24;--panel:#212838;--panel2:#2b3448;--ink:#eef2f8;--muted:#a6b1c4;--line:#3a4560;
 --r:#e0584f;--b:#4f86e6;--g:#2f9d5f;--y:#d19a22;--p:#9a78e0;
 --rt:#ee7b73;--bt:#7aa5f0;--gt:#4cc27c;--yt:#f2c94c;--pt:#b391ee;
 --btn:#eef2f8;--btnink:#151a24;--shadow:rgba(0,0,0,.5);--gold:#f0b429;--shard:#5bc0ee;--goldbg:#4a3b12;--goldink:#ffd983;
 --slab:#0f1521;--slab2:#1b2438}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:440px;margin:0 auto;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:0;cursor:pointer}
#tabs{display:flex;gap:4px;padding:6px 8px 0;flex:none}
#tabs button{flex:1;height:34px;border-radius:10px;font-size:12px;font-weight:800;padding:0 2px;box-shadow:0 2px 0 var(--shadow)}
#tabs button[aria-selected=true]{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
#desc{flex:none;padding:4px 14px 3px;font-size:11px;line-height:1.3;color:var(--muted);height:46px;overflow:hidden}
#desc b{color:var(--ink)}
#app{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:0 12px 10px;position:relative}
.hdr{display:flex;align-items:center;gap:6px;height:38px;flex:none}
.hdr h1{margin:0;font-size:20px;letter-spacing:-.02em;flex:1}
.cur{display:flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:15px;background:var(--panel);box-shadow:0 2px 0 var(--shadow);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.cur::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--gold)}.cur.sh::before{border-radius:3px;transform:rotate(45deg);background:var(--shard);width:10px;height:10px}
.mapw{flex:1;min-height:0;position:relative}
.mapw>svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
svg .st{cursor:pointer}svg .hit{fill:transparent}
svg text{font-family:inherit}
/* card */
.card{flex:none;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:0 3px 0 var(--shadow);display:flex;gap:10px}
.card.stack{flex-direction:column;gap:9px}
.ci{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ov{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.ov i{width:9px;height:9px;border-radius:3px;flex:none}
.ct{display:flex;align-items:center;gap:8px;font-size:18px;letter-spacing:-.01em}
.pill{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:9px;padding:0 7px;line-height:17px;background:var(--panel2);color:var(--muted)}
.pill.c{background:color-mix(in srgb,var(--g) 18%,var(--panel));color:var(--gt)}
.pill.a{background:var(--btn);color:var(--btnink)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:11px;background:var(--panel2);font-size:11px;font-weight:700;white-space:nowrap}
.chip.gold{background:var(--goldbg);color:var(--goldink)}
.bars{display:inline-flex;gap:2px}.bars i{width:6px;height:9px;border-radius:2px;background:var(--line)}.bars i.on{background:var(--c)}
.play{flex:none;background:var(--btn);color:var(--btnink);border:0;border-radius:16px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 0 var(--shadow)}
.play svg{width:18px;height:18px;fill:currentColor}
.card:not(.stack) .play{width:84px;flex-direction:column;gap:4px;font-size:15px}.card:not(.stack) .play svg{width:26px;height:26px}
.card.stack .play{height:50px;width:100%}
.play:disabled{opacity:.35;box-shadow:none;cursor:default}
/* dock */
.dock{flex:none;display:grid;grid-template-columns:repeat(5,1fr);height:56px;background:var(--panel);border-radius:18px;box-shadow:0 2px 0 var(--shadow),0 0 0 2px var(--line) inset;padding:3px}
.dock button{border:0;background:none;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:800;color:var(--muted)}
.dock svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* focus */
.fplate{position:absolute;inset:0;background:var(--panel);border:2px solid var(--line);border-radius:20px;box-shadow:0 2px 0 var(--shadow);padding:10px}
.fplate svg{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px)}
.nv{position:absolute;top:50%;margin-top:-22px;width:30px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 var(--shadow);z-index:2}
.nv svg{position:static;width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.nv.l{left:-6px}.nv.r{right:-6px}.nv:disabled{opacity:.3;box-shadow:none}
.mini{flex:none;height:78px;position:relative}.mini svg{position:absolute;inset:0;width:100%;height:100%}
/* index */
.idx{position:absolute;inset:0;overflow:auto;padding:2px 0 6px;scrollbar-width:none}
.blk{position:relative;padding:0 0 12px 30px}
.blk h2{margin:0;display:flex;align-items:baseline;gap:8px;font-size:25px;font-weight:300;letter-spacing:-.03em;line-height:1.1}
.blk h2 small{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:0;font-variant-numeric:tabular-nums}
.blk.dim h2{color:var(--muted);font-size:19px}
.blk .dt{position:absolute;left:3px;top:7px;width:11px;height:11px;border-radius:4px;background:var(--cc)}
.blk.dim .dt{background:none;border:2px solid var(--line)}
.blk .row{display:flex;align-items:center;margin-top:7px;gap:0}
.blk .cn{flex:1;min-width:10px;max-width:26px;height:2px;background:var(--line)}
.blk .ghost{opacity:1}
.sp1{position:absolute;left:8px;top:12px;width:0;border-left:2px solid var(--line)}
.el{position:absolute;left:8px;top:0;width:15px;height:16px;border-left:2px solid var(--line);border-bottom:2px solid var(--line);border-radius:0 0 0 9px}
.slab{position:absolute;inset:0;background:var(--slab);border-radius:20px;box-shadow:0 3px 0 var(--shadow)}
.slab svg{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px)}
</style>
</head>
<body>
<div id="tabs" role="tablist"></div>
<div id="desc"></div>
<div id="app"></div>
<script>
var $=function(s){return document.querySelector(s)};
var REG={g:{n:'Greenvale',v:'--g',t:'--gt',boss:'Thornwarden'},b:{n:'Frostreach',v:'--b',t:'--bt',boss:'Rime Matriarch'},y:{n:'Goldmarch',v:'--y',t:'--yt',boss:'Dune Colossus'},r:{n:'Emberfall',v:'--r',t:'--rt',boss:'Cinder Tyrant'},p:{n:'Duskmoor',v:'--p',t:'--pt',boss:'The Gloaming'}};
var DIFFW=['','Gentle','Steady','Tricky','Hard','Brutal'];

var AREAS={
 g1:{n:'Hollow',reg:'g',d:1,s:'ccc',f:[3,3,4]},
 g2:{n:'Brookside',reg:'g',d:2,s:'ccal',f:[4,4,5,6]},

 y1:{n:'Saltwell',reg:'y',d:3,s:'all',f:[5,5,6]},
 b2:{n:'Glacier Steps',reg:'b',d:4,s:'hhh',f:[6,6,7]},
 y2:{n:'Ochre Pass',reg:'y',d:4,s:'hhh',f:[6,6,7]},

function mkset(rows){var m={};rows.forEach(function(row,r){for(var c=0;c<row.length;c++){var ch=row.charAt(c);if(ch!=='.'&&ch!==' '){(m[ch]=m[ch]||[]).push([r,c])}}});return m}

 cells.forEach(function(p){var r=p[0],c=p[1],T=set[(r-1)+','+c],B=set[(r+1)+','+c],L=set[r+','+(c-1)],R=set[r+','+(c+1)],X=x0+c*u,Y=y0+r*u,
  xa=X+(L?-.4:ins),xb=X+u-(R?-.4:ins),ya=Y+(T?-.4:ins),yb=Y+u-(B?-.4:ins),tl=(!T&&!L)?rx:0,tr=(!T&&!R)?rx:0,br=(!B&&!R)?rx:0,bl=(!B&&!L)?rx:0,f=function(v){return v.toFixed(1)},
  A=function(k,x,y){return k?'A'+f(k)+' '+f(k)+' 0 0 1 '+f(x)+' '+f(y):''};
  o.push('M'+f(xa+tl)+' '+f(ya)+'H'+f(xb-tr)+A(tr,xb,ya+tr)+'V'+f(yb-br)+A(br,xb-br,yb)+'H'+f(xa+bl)+A(bl,xa,yb-bl)+'V'+f(ya+tl)+A(tl,xa+tl,ya)+'Z')});return o}

 if(sel&&ch!=='c')return '<path '+t+' d="M-3 -5.5L5.500 0-3 5.500z" style="fill:'+P.sg+';stroke:'+P.sg+';stroke-width:1.5;stroke-linejoin:round"/>';
 if(ch==='c'||sel)return '<path '+t+' d="M-5 .5L-1.500 4 5.500-3.500" style="fill:none;stroke:'+(sel?P.sg:'#fff')+';stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round"/>';
 if(ch==='l')return '<g '+t+' style="fill:none;stroke:'+P.lk+';stroke-width:2;stroke-linecap:round"><path d="M-3 -1V-2.500a3 3 0 0 1 6 0V-1"/><rect x="-4.500" y="-1" width="9" height="6.500" rx="1.800" style="fill:'+P.lk+';stroke:none"/></g>';
 return ''}
function piece(k,cells,u,x0,y0,ch,col,P,o){o=o||{};var sel=S.sel===k,ins=o.ins||(u>=40?2.5:1.5),rx=Math.min(10,u*.27),s='',
 mx=0,my=0,x1=1e9,y1=1e9,x2=0,y2=0;
 cells.forEach(function(p){mx+=p[0];my+=p[1];x1=Math.min(x1,p[1]);y1=Math.min(y1,p[0]);x2=Math.max(x2,p[1]+1);y2=Math.max(y2,p[0]+1)});mx/=cells.length;my/=cells.length;
 var best=cells[0],bd=1e9;cells.forEach(function(p){var d=Math.pow(p[0]-mx,2)+Math.pow(p[1]-my,2);if(d<bd){bd=d;best=p}});
 var cv='var('+col+')',R=function(i,r){return rectsOf(cells,u,x0,y0,i,r===undefined?rx:r)};

 s+='<rect class="hit" x="'+(x0+x1*u-4)+'" y="'+(y0+y1*u-4)+'" width="'+((x2-x1)*u+8)+'" height="'+((y2-y1)*u+8)+'"/>';
 if(sel)s+=rg(R(ins-4.5,rx+4),'fill:'+cv+';opacity:.3',rx+4);
 if(sel)s+=rg(R(ins),'fill:'+cv,rx)+rg(R(ins+2.6,Math.max(rx-2,2)),'fill:'+P.sf,Math.max(rx-2,2));
 else if(ch==='c')s+=rg(R(ins),'fill:'+cv,rx);

 else s+=rg(R(ins),'fill:'+P.ll,rx)+rg(R(ins+1.5,Math.max(rx-1,2)),'fill:'+P.lf,Math.max(rx-1,2));
 s+=glyph(ch,sel,x0+(best[1]+.5)*u,y0+(best[0]+.5)*u,Math.min(1.7,Math.max(.75,u/30)),P);

function ghost(x,y,w,h,rx,P){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+rx+'" style="fill:none;stroke:'+(P===PS?'rgba(255,255,255,.22)':'var(--line)')+';stroke-width:1.6;stroke-dasharray:2 5;stroke-linecap:round"/>'}
/* ---------- shared chrome ---------- */

var IC={Puzzles:'<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4z"/><path d="M13 13h7v7h-7z" stroke-dasharray="2 2.500"/>',Endless:'<path d="M12 12c-2-3-3.500-4-5.500-4a4 4 0 0 0 0 8c2 0 3.500-1 5.500-4s3.500-4 5.500-4a4 4 0 0 1 0 8c-2 0-3.500-1-5.500-4z"/>',Hero:'<path d="M12 3l7 3v5.500c0 4.500-3 7.500-7 9.500-4-2-7-5-7-9.500V6z"/>',Team:'<circle cx="9" cy="8.500" r="3"/><path d="M3 19c0-3 3-5 6-5s6 2 6 5"/><circle cx="17.500" cy="9" r="2.400"/><path d="M17 14c2.500 0 4 1.600 4 4"/>',More:'<circle cx="5.500" cy="12" r="1.200"/><circle cx="12" cy="12" r="1.200"/><circle cx="18.500" cy="12" r="1.200"/>'};
function dock(){return '<div class="dock">'+['Puzzles','Endless','Hero','Team','More'].map(function(n){return '<button aria-label="'+n+'"><svg viewBox="0 0 24 24">'+IC[n]+'</svg>'+n+'</button>'}).join('')+'</div>'}
function card(mode){var q=parse(S.sel),A=AREAS[q[0]],R=REG[A.reg],ch=st(q[0],q[1]),i=q[1],n=A.s.length,boss=i===n-1,bars='';
 for(var z=1;z<=5;z++)bars+='<i'+(z<=A.d?' class="on"':'')+'></i>';
 var info='<div class="ci"><div class="ov" style="color:var('+R.t+')"><i style="background:var('+R.v+')"></i>'+R.n+' &middot; '+A.n+'</div>'+
  '<div class="ct"><b>Stage '+(i+1)+' of '+n+'</b><span class="pill '+ch+'">'+(ch==='c'?'Cleared':ch==='a'?'Ready':'Locked')+'</span></div>'+
  '<div class="chips"><span class="chip">'+DIFFW[A.d]+'<span class="bars" style="--c:var('+R.v+')">'+bars+'</span></span><span class="chip">'+A.f[i]+' fights</span><span class="chip">'+(boss?'Boss &middot; '+R.boss:'No boss')+'</span><span class="chip gold">'+(boss?'Tile pack':i%2?'Shards ×'+4*A.d:'Coins ×'+60*A.d)+'</span></div></div>';
 var pl='<button class="play"'+(ch==='l'?' disabled':'')+'><svg viewBox="0 0 24 24"><path d="M7 4.500l13 7.500-13 7.500z"/></svg>'+(ch==='c'?'Replay':ch==='l'?'Locked':'Play')+'</button>';
 return '<div class="card '+mode+'">'+info+pl+'</div>'}
function frame(mid,mode,extra){return hdr()+(extra||'')+'<div class="mapw">'+mid+'</div>'+card(mode)+dock()}
/* ---------- 1 Rings ---------- */
var CX=168,CY=212,RW={g1:{ring:1,a:[92,268],w:[1,1.5,1]},g2:{ring:2,a:[104,256],w:[1,1,1,1.5]},b1:{ring:3,a:[262,352],w:[1,1.3,1]},y1:{ring:3,a:[8,98],w:[1,1.3,1],rev:1},b2:{ring:4,a:[262,352],w:[1,1.3,1]},y2:{ring:4,a:[8,98],w:[1,1.3,1],rev:1},r1:{ring:5,a:[262,352],w:[1,1.3,1]},p1:{ring:5,a:[8,98],w:[1,1.3,1],rev:1}};
function pol(r,a){var t=a*Math.PI/180;return[CX+r*Math.sin(t),CY-r*Math.cos(t)]}
function f2(p){return p[0].toFixed(1)+' '+p[1].toFixed(1)}
function sector(r0,r1,a0,a1){var p=pol(r1,a0),q=pol(r1,a1),s=pol(r0,a1),e=pol(r0,a0),big=(a1-a0>180)?1:0;return 'M'+f2(p)+'A'+r1+' '+r1+' 0 '+big+' 1 '+f2(q)+'L'+f2(s)+'A'+r0+' '+r0+' 0 '+big+' 0 '+f2(e)+'Z'}
function D1(){var s='<svg viewBox="0 0 336 424" preserveAspectRatio="xMidYMid meet" aria-label="Map, rings">';
 for(var i=1;i<=5;i++){var rr=36+(i-1)*34-2;s+='<circle cx="'+CX+'" cy="'+CY+'" r="'+(rr+2+31)+'" style="fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:1 5;stroke-linecap:round;opacity:.9"/>'}
 Object.keys(AREAS).forEach(function(id){var w=RW[id],A=AREAS[id],col='var('+REG[A.reg].v+')',r0=36+(w.ring-1)*34,r1=r0+30,tot=w.w.reduce(function(a,b){return a+b},0),span=w.a[1]-w.a[0],ac=w.a[0];
  if(!vis(id)){s+='<path d="'+sector(r0,r1,w.a[0]+1.5,w.a[1]-1.5)+'" style="fill:color-mix(in srgb,'+col+' 6%,transparent);stroke:color-mix(in srgb,'+col+' 40%,var(--line));stroke-width:1.4;stroke-dasharray:2 5;stroke-linecap:round"/>';return}
  var arr=[];A.s.split('').forEach(function(ch,j){arr.push(j)});
  var cum=0;w.w.forEach(function(wt,j){var idx=w.rev?j:j,a0=w.rev?w.a[1]-(cum+wt)/tot*span:w.a[0]+cum/tot*span,a1=a0+wt/tot*span;cum+=wt;
   var gap=(3/(r0+15))*57.3/2,rr0=r0+1.5,rr1=r1-1.5,k=id+'.'+j,ch=st(id,j),sel=S.sel===k,sp=sel?5:0;
   var ca=(a0+a1)/2,cp=pol((rr0+rr1+sp)/2,ca);
   var path=sector(rr0,rr1+sp,a0+gap,a1-gap);
   s+='<g class="st" data-k="'+k+'" role="button" aria-label="'+A.n+' stage '+(j+1)+'">';
   if(sel)s+='<path d="'+sector(rr0-3,rr1+sp+3,a0+gap-.8,a1-gap+.8)+'" style="fill:'+col+';opacity:.3;stroke:'+col+';stroke-width:4;stroke-linejoin:round"/>';
   if(sel)s+='<path d="'+path+'" style="fill:var(--btn);stroke:'+col+';stroke-width:3;stroke-linejoin:round"/>';
   else if(ch==='c')s+='<path d="'+path+'" style="fill:'+col+';stroke:'+col+';stroke-width:3;stroke-linejoin:round"/>';
   else if(ch==='a')s+='<path d="'+path+'" style="fill:'+PL.af(col)+';stroke:'+col+';stroke-width:2.4;stroke-linejoin:round"/>';
   else s+='<path d="'+path+'" style="fill:var(--panel2);stroke:var(--line);stroke-width:2;stroke-linejoin:round"/>';
   s+=glyph(ch,sel,cp[0],cp[1],.9,PL)+'</g>'});
 });
 s+='<circle cx="'+CX+'" cy="'+CY+'" r="27" style="fill:var(--btn)"/><circle cx="'+CX+'" cy="'+CY+'" r="8" style="fill:none;stroke:var(--btnink);stroke-width:2;opacity:.9"/><circle cx="'+CX+'" cy="'+CY+'" r="3" style="fill:var(--gold)"/></svg>';
 return frame(s,'side')}
/* ---------- 2 Lines ---------- */
var LP={ // centre x,y and shape
