 ['1. Kiln, light','The same glazed ceramic family as before, now on speckled bisque clay. Every panel is a fired plaque with two cut corners, and the map is painted like a tile mural, with a cream path winding through hills, a river and fields. Labels are plain words, set into the clay.',k1home,k1tiles,k1res],

 ['4. Tabletop','You look down at a table. The map is a folded paper sheet with a pencil path and a game tile standing on your stage. Menu items are things you would own, a card, a coil of rope, a pouch, a box and a book, and the result is a handwritten note held with a pin.',k4home,k4tiles,k4res],
