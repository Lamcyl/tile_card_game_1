<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tile Run Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>
:root{color-scheme:light dark;
 --bg:#eef1f5;--panel:#ffffff;--panel2:#e4e9f0;--ink:#1c2635;--muted:#566377;--line:#c9d1dc;--cellbg:#f8fafc;
 --r:#d2473f;--b:#2e6bd3;--g:#23874f;--y:#e0a800;--p:#7b4bc4;--x:#6b7488;
 --rt:#d2473f;--bt:#2e6bd3;--gt:#23874f;--yt:#8a6500;--pt:#7b4bc4;--xt:#5b6478;
 --ron:#fff;--bon:#fff;--gon:#fff;--yon:#1c1500;--pon:#fff;--xon:#fff;
 --ok:#1b8a4a;--bad:#c23a3a;--warn:#b86a00;--enemy:#33405a;--enemyink:#ffffff;
 --btn:#1c2635;--btnink:#ffffff;--shadow:rgba(20,30,50,.18);--okbg:#dff3e6;--badbg:#fbe3e3;--gold:#e0a100;--hp:#c23a3a;--hpbg:#e9d3d3}
@media (prefers-color-scheme: dark){:root{
 --bg:#151a24;--panel:#212838;--panel2:#2b3448;--ink:#eef2f8;--muted:#a6b1c4;--line:#3a4560;--cellbg:#1b2130;
 --r:#e0584f;--b:#4f86e6;--g:#2f9d5f;--y:#e8b923;--p:#9468de;--x:#7d869b;
 --rt:#ee7b73;--bt:#7aa5f0;--gt:#4cc27c;--yt:#f2c94c;--pt:#b391ee;--xt:#a6afc2;
 --ron:#fff;--bon:#fff;--gon:#fff;--yon:#1c1500;--pon:#fff;--xon:#10131b;
 --ok:#4cc27c;--bad:#ef6a6a;--warn:#e2a03a;--enemy:#3b4a69;--enemyink:#ffffff;
 --btn:#eef2f8;--btnink:#151a24;--shadow:rgba(0,0,0,.5);--okbg:#1f3a2c;--badbg:#412428;--gold:#f0b429;--hp:#ef6a6a;--hpbg:#4a2c31}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
body{min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,select{font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:0;cursor:pointer}
select{padding:4px 6px;border-radius:8px;border-width:1px}
#app{width:100%;max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:0 12px 12px;display:flex;flex-direction:column}
[hidden]{display:none!important}
h1{margin:16px 0 2px;font-size:30px;letter-spacing:-.02em;color:var(--ink)}
h2{margin:14px 0 6px;font-size:16px;color:var(--ink)}
.sub{color:var(--muted);margin:0 0 10px;font-size:14px}
.muted{color:var(--muted)}
.btn{height:46px;border-radius:14px;font-weight:800;font-size:16px;padding:0 14px}
.btn.main{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{height:34px;font-size:13px;border-radius:10px;padding:0 10px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:10px}
header.top{display:flex;align-items:center;gap:8px;height:46px;flex:none}
.hbtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;flex:none}
.hbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ttl{flex:1;text-align:center;font-weight:800;font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* tiles */
.tile{position:relative;width:var(--ts);height:var(--ts);border-radius:calc(var(--ts)*.18);display:flex;align-items:center;justify-content:center;background:var(--tc);color:var(--on);box-shadow:0 2px 0 var(--shadow);touch-action:none;cursor:grab;flex:none}
.c-r{--tc:var(--r);--on:var(--ron);--tt:var(--rt)}.c-b{--tc:var(--b);--on:var(--bon);--tt:var(--bt)}.c-g{--tc:var(--g);--on:var(--gon);--tt:var(--gt)}
.c-y{--tc:var(--y);--on:var(--yon);--tt:var(--yt)}.c-p{--tc:var(--p);--on:var(--pon);--tt:var(--pt)}.c-x{--tc:var(--x);--on:var(--xon);--tt:var(--xt)}
.tile.k-boost{background:var(--panel);color:var(--tt);border:3px solid var(--tc)}
.tile.k-mod{background:var(--panel);color:var(--tt);border:3px dashed var(--tc)}
.tile .num{font-size:calc(var(--ts)*.42);line-height:1;font-weight:800;margin-top:calc(var(--ts)*-.05);font-variant-numeric:tabular-nums}
.tile.k-boost .num,.tile.k-mod .num{font-size:calc(var(--ts)*.36)}
.tile .glyph{position:absolute;left:8%;top:8%;width:30%;height:30%}
.tile .sym{position:absolute;right:8%;top:8%;width:19%;height:19%}
.tile .nm{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-style:normal;font-size:calc(var(--ts)*.125);font-weight:800;letter-spacing:.05em}
.tile.small .nm{display:none}
.tile.chg{box-shadow:0 0 0 3px var(--gold)}
.tile.dragging{opacity:.35}
.tile.spent{opacity:.28;filter:grayscale(1)}
.tile.fade{opacity:.4}
.ghost{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-60%) scale(1.12);opacity:.92}
.pulse{animation:pulse .34s ease-out}
@keyframes pulse{0%{transform:scale(1)}45%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes lunge{0%{transform:translateY(0)}40%{transform:translateY(10px)}100%{transform:translateY(0)}}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes fly{0%{opacity:0;transform:translate(-50%,-50%)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)))}}
.shake{animation:shake .35s}
/* home */
.areas{display:flex;flex-direction:column;gap:8px}
.area{display:flex;align-items:center;gap:10px;width:100%;min-height:62px;text-align:left;padding:8px 14px;background:var(--panel);border:2px solid var(--line);border-radius:14px;box-shadow:0 2px 0 var(--shadow)}
.area b{font-size:17px;color:var(--ink)}.area small{display:block;font-size:12px;color:var(--muted)}
.area .go{margin-left:auto;font-weight:800;color:var(--btnink);background:var(--btn);border-radius:10px;padding:6px 12px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.uchip{display:flex;align-items:center;gap:5px;background:var(--panel2);border-radius:10px;padding:4px 8px;font-size:12px;font-weight:700;color:var(--ink)}
.dot{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--tc);color:var(--on);align-items:center;justify-content:center;flex:none}
.dot svg{width:11px;height:11px}
.inv{display:flex;flex-wrap:wrap;gap:6px}
.inv .tile{--ts:46px}
.inv .tile.sel{outline:3px solid var(--ink);outline-offset:2px}
.linkrow{display:flex;gap:8px;margin-top:4px}
.linkrow .btn{flex:1}
/* team */
.ucard{border:2px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px;background:var(--panel)}
.ucard.pick{border-color:var(--tt);box-shadow:inset 0 0 0 1px var(--tt)}
.ucard.locked{opacity:.85}
.uhead{display:flex;align-items:center;gap:8px}
.uhead b{font-size:15px;color:var(--ink)}
.lvl{font-size:11px;font-weight:800;color:var(--muted);background:var(--panel2);border-radius:8px;padding:1px 6px}
.rline{font-size:12.5px;color:var(--ink);margin:4px 0}
.rline i{font-style:normal;font-weight:800;color:var(--tt)}
.kit{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 6px}
.kit .tile{--ts:34px;box-shadow:none}
.kit .tile .num{font-size:calc(var(--ts)*.46)}
.ctext{font-size:12px;color:var(--muted)}
/* map */
.hpbar{position:relative;height:18px;border-radius:9px;background:var(--hpbg);overflow:hidden;flex:1;min-width:90px}
.hpbar i{position:absolute;left:0;top:0;bottom:0;background:var(--hp);transition:width .5s}
.hpbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.path{display:flex;align-items:center;gap:6px;margin:4px 0 10px}
.node{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--muted);background:var(--panel)}
.node.done{background:var(--ok);border-color:var(--ok);color:#fff}
.node.cur{border-color:var(--ink);color:var(--ink)}
.node.boss{border-radius:8px}
.seg{flex:1;height:3px;background:var(--line)}
.offer{display:block;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px;box-shadow:0 2px 0 var(--shadow);cursor:pointer}
.offer.elite{border-color:var(--warn)}.offer.boss{border-color:var(--bad)}
.ohead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ohead b{font-size:15px;color:var(--ink)}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.05em;border-radius:8px;padding:1px 6px;background:var(--panel2);color:var(--muted)}
.offer.elite .tag{background:var(--warn);color:#fff}.offer.boss .tag{background:var(--bad);color:#fff}
.rew{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--ink)}
.rew .tile{--ts:26px;box-shadow:none;border-width:2px}
.rew .tile .glyph,.rew .tile .sym{display:none}
.rew .tile .num{font-size:12px;margin:0}
.oen{display:grid;gap:5px}
.mini{background:var(--enemy);color:var(--enemyink);border-radius:10px;padding:4px 2px;text-align:center;min-width:0}
.mini b{display:block;font-size:20px;line-height:1.05;color:var(--enemyink)}
.mini small{font-size:10px;color:var(--enemyink);opacity:.9;font-weight:700}
.mini.g{outline:2px dashed var(--gold);outline-offset:-3px}
.ofoot{display:flex;gap:6px;margin-top:6px;font-size:11.5px;color:var(--muted);align-items:center;flex-wrap:wrap}
.bcb{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:18px;border-radius:6px;font-size:11px;font-weight:800;padding:0 4px;background:var(--gold);color:#1c1500}
/* fight */
#fight{padding-top:0}
#fhead{display:flex;align-items:center;gap:8px;height:46px;flex:none}
.stat{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.mombadge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;background:var(--gold);color:#1c1500;border-radius:9px;padding:2px 8px;animation:glow 1.4s infinite}
#fen,#fboard{display:grid;grid-template-columns:repeat(var(--n),var(--cs));gap:6px;justify-content:center}
.enemy{display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.etile{position:relative;height:50px;border-radius:12px;background:var(--enemy);color:var(--enemyink);border:3px solid var(--enemy);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.etile b{font-size:24px;line-height:.95;font-weight:800;color:var(--enemyink);font-variant-numeric:tabular-nums}
.etile i{font-style:normal;font-size:8.5px;font-weight:800;letter-spacing:.06em;color:var(--enemyink);opacity:.9}
.etile .atk{position:absolute;right:4px;top:2px;font-size:11px;font-weight:800;color:var(--enemyink);display:flex;align-items:center;gap:1px}
.etile .atk svg{width:9px;height:9px;fill:var(--enemyink)}
.enemy.guard .etile{border-style:dashed;border-color:var(--gold)}
.enemy.boss .etile{border-color:var(--bad)}
.enemy.dead .etile{background:var(--panel2);border-color:var(--line);opacity:.6}.enemy.dead .etile b,.enemy.dead .etile i,.enemy.dead .atk{color:var(--muted)}
.enemy.hit .etile{animation:lunge .4s}
.ebar{position:relative;height:9px;border-radius:5px;background:var(--hpbg);overflow:hidden}
.ebar i{position:absolute;left:0;top:0;bottom:0;background:var(--hp);transition:width .5s}
.ebar u{position:absolute;top:0;bottom:0;background:var(--gold);opacity:.85;transition:width .3s;text-decoration:none}
.pill{height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:var(--panel2);color:var(--muted);border:2px solid var(--line);padding:0 5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.enemy.kill .pill{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.enemy.has .pill{color:var(--ink)}
.enemy.kill .etile{border-color:var(--ok)}
#bwrap{position:relative;margin-top:6px}
.cell{position:relative;width:var(--cs);height:var(--cs);border-radius:12px;background:var(--cellbg);border:2px dashed var(--line);display:flex;align-items:center;justify-content:center}
.cell.x{border:2px solid var(--line);background:repeating-linear-gradient(45deg,var(--panel2) 0 6px,var(--cellbg) 6px 12px)}
.cell.occ{border:none;background:transparent}
.cell .bb{position:absolute;left:3px;bottom:2px;font-size:11px;font-weight:800;color:var(--warn);pointer-events:none}
.cell.bonus{background:color-mix(in srgb,var(--gold) 20%,var(--cellbg));border-color:var(--gold)}
.cell.occ.bonus{background:transparent}
.cell.occ .bb{display:none}
.cell .pv{position:absolute;right:4px;bottom:2px;font-size:12px;font-weight:800;color:var(--ink);pointer-events:none}
.cell.hold.free{border-style:solid;border-color:var(--ink)}
.cell.glow{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 25%,var(--cellbg));animation:glow 1s ease-in-out infinite}
.cell.glow .pv{color:var(--ok)}
.fly{position:fixed;z-index:70;font-weight:900;font-size:19px;color:var(--ink);pointer-events:none;transform:translate(-50%,-50%);text-shadow:0 0 4px var(--bg),0 0 4px var(--bg),0 0 8px var(--bg);animation:fly .75s ease-in forwards}
.fly.bad{color:var(--bad)}
#rbar{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.rrow{display:flex;align-items:center;gap:6px;font-size:11.5px;line-height:1.2;color:var(--ink);padding:2px 4px;border-radius:8px;background:var(--panel)}
.rrow b{color:var(--tt);white-space:nowrap}
.rrow span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#finfo{min-height:32px;font-size:12.5px;line-height:1.3;text-align:center;color:var(--ink);padding:5px 4px 2px;flex:none}
#ftabs{display:flex;gap:5px;justify-content:center;margin-top:2px;flex:none}
.tab{min-width:48px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:13px;padding:0 6px;background:var(--panel);color:var(--ink);border:2px solid var(--line)}
.tab.on{border-color:var(--tt);background:var(--panel2)}
.tab.empty{opacity:.4}
#fhand{display:grid;grid-template-columns:repeat(auto-fill,54px);gap:6px;justify-content:space-between;margin-top:6px;overflow-y:auto;flex:1;min-height:60px;align-content:start;padding:2px}
#fhand .tile{--ts:54px}
#fhand .tile.sel{outline:4px solid var(--ink);outline-offset:2px;transform:translateY(-3px)}
#fbar{display:flex;gap:10px;padding-top:8px;flex:none}
#fbar .btn{height:48px}
#fclear{flex:1}#fatk{flex:2.2}
/* cards, modals */
#dim{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:55}
#card,#modal{position:fixed;left:50%;transform:translateX(-50%);z-index:60;width:min(350px,calc(100vw - 28px));background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:16px;padding:14px;box-shadow:0 8px 28px var(--shadow)}
#card{top:30%;z-index:65}
#card h3,#modal h3{margin:0 0 6px;font-size:17px;color:var(--ink)}
#card p{margin:4px 0;font-size:14px;line-height:1.35;color:var(--ink)}
#card .cardtile{float:left;margin:0 12px 4px 0;--ts:56px}
#card table{width:100%;border-collapse:collapse;font-size:13px;clear:both}#card td{padding:2px 0;color:var(--ink)}#card td:last-child{text-align:right;font-weight:800}
#modal{top:50%;transform:translate(-50%,-50%);max-height:88vh;overflow:auto;-webkit-user-select:text;user-select:text}
#modal ol{margin:0;padding-left:20px}#modal li{margin:6px 0;font-size:14px;line-height:1.35;color:var(--ink)}
#modal .set{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px;color:var(--ink)}
#modal .set label{flex:1}
#modal .btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#modal .btnrow .btn{flex:1;min-width:110px}
.big{font-size:22px;font-weight:800;color:var(--ink)}
.resbox{margin-top:12px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.resbox.win{border-color:var(--ok)}.resbox.lose{border-color:var(--bad)}
.resbox h2{font-size:24px;margin:0 0 6px}
.resbox p{font-size:14px;margin:4px 0;color:var(--ink)}
.resbox .inv{justify-content:center;margin:8px 0}
.resbox .btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.gold{color:var(--warn);font-weight:800}
@media (max-height:760px){.etile{height:44px}}
</style>
</head>
<body>
<div id="app">
  <section id="home" class="screen"></section>
  <section id="team" class="screen" hidden></section>
  <section id="map" class="screen" hidden></section>
  <section id="fight" class="screen" hidden>
    <div id="fhead"></div>
    <div id="fen"></div>
    <div id="bwrap"><div id="fboard"></div></div>
    <div id="rbar"></div>
    <div id="finfo"></div>
    <div id="ftabs"></div>
    <div id="fhand"></div>
    <div id="fbar"><button class="btn" id="fclear">Clear</button><button class="btn main" id="fatk">Attack</button></div>
  </section>
  <section id="result" class="screen" hidden></section>
</div>
<div id="dim" hidden></div>
<div id="modal" hidden></div>
<div id="card" hidden></div>
<script>
/*RULES-START*/
var CONFIG = {
  rows: 3,
  maxColourless: 3,                 /* colourless tiles allowed in the bag before a run */
  heroHp: [30, 40, 50],             /* by area */
  areas: [
    { name: 'Meadow', cols: 3, hp: 6,  atk: 2, coin: 1, lvl: 1 },   /* hp = per enemy column at step 0 */
    { name: 'Quarry', cols: 4, hp: 11, atk: 3, coin: 2, lvl: 2 },
    { name: 'Spire',  cols: 5, hp: 16, atk: 4, coin: 3, lvl: 3 }
  ],
  bossEvery: 4,                     /* steps per segment: (bossEvery-1) fights, then a boss */
  offers: 3, offerTwoChance: 0.25,
  eliteChance: 0.3, wideChance: 0.3,
  guardChance: [0.12, 0.2, 0.25],
  blockChance: 0.25,
  bonusCount: [0.3, 0.45, 0.25],    /* chance of 0,1,2 bonus cells */
  bonusTypes: { p1: 0.45, p2: 0.3, x2: 0.25 },
  growth: 0.06,                     /* hp/atk growth per fight won in a run */
  jitter: 0.3,
  normal: { hp: 1, atk: 1, coin: 1, tile: 0.25 },
  elite:  { hp: 1.5, atk: 1.3, coin: 2, tile: 0.7 },
  boss:   { hp: 2, atk: 1.6, coin: 4, tile: 1, phase2: 0.5, bonusChance: 0.6, bonusMax: 2, heal: 0.4 },
  coinBase: 5, coinDepth: 0.12,
  healPerFight: 2,
  deathKeep: 0.5,                   /* fraction of run coins and loot kept when the run ends in defeat */
  momentum: { on: true, bonus: 1, values: [1, 2, 3] },
  levelCost: { 2: 30, 3: 70 }, unlockCost: 40,
  startCoins: 0,
  longPressMs: 450,
  react: { contrast: 1, spectrum: 1, relay: 2, prism: 3, cluster: 1, loner: 2, vanguard: 2, airy: 1, tower: 1, hub: 2, diag: 2, pure: 3 }
};
var SHAPES = {
  strike: { name: 'Strike', kind: 'attack', short: 'STRIKE', desc: 'Hits the enemy in its own column.' },
  fork:   { name: 'Fork',   kind: 'attack', short: 'FORK',   desc: 'Hits the enemies in both neighbouring columns, not its own.' },
  plus:   { name: 'Plus',   kind: 'boost',  short: 'PLUS',   desc: 'Booster: adds its number to each Strike and Fork touching it (up, down, left, right).' },
  row:    { name: 'Row',    kind: 'boost',  short: 'ROW',    desc: 'Booster: adds its number to every Strike and Fork in its row.' },
  dbl:    { name: 'Double', kind: 'mod',    short: 'DOUBLE', desc: 'Doubles the tile in front of it (the row nearer the enemies). Ignores bonus cells.' }
};
var COLOR_IDS = ['r', 'b', 'g', 'y', 'p'];

      $('#fight').classList.add('shake'); await sleep(380); $('#fight').classList.remove('shake');
    } else await sleep(150);
  } catch (e) { /* animation must never block the game */ }
  S.lastOut = info;
  if (info.lose) { endRun(info.lose); return; }
  if (info.win) { var out = finishFight(run, fs); S.lastOut = out; showFightResult(out); return; }
  S.phase = 'edit'; renderFight();
}

/* ---------- results ---------- */
function resTile(t) { return tileHTML({ c: 'x', s: t.s, n: t.n }, { cls: 'small', ts: 46 }); }
function showFightResult(out) {
  var run = S.run, h = '';
  if (out.boss) {
    h = '<div class="resbox win"><h2>Boss defeated</h2><p>Your bag is replenished: <b>' + out.rep.returned + '</b> spent tiles returned' + (out.rep.bonus.length ? ', plus <b>' + out.rep.bonus.length + ' bonus colourless tile' + (out.rep.bonus.length > 1 ? 's' : '') + '</b> for the rest of this run' : ', no bonus tiles this time') + '.</p>';
    if (out.rep.bonus.length) h += '<div class="inv">' + out.rep.bonus.map(resTile).join('') + '</div>';
    h += '<p>Healed ' + out.heal + ' HP. Hero ' + run.hp + ' / ' + run.maxHp + '. Bag ' + bagLeft(run) + ' tiles.</p>';
  } else h = '<div class="resbox win"><h2>Victory</h2><p>' + (out.attacks === 1 ? 'Won in one attack' : 'Won in ' + out.attacks + ' attacks') + ', ' + out.used + ' tile' + (out.used > 1 ? 's' : '') + ' spent. Bag ' + bagLeft(run) + ' / ' + run.bag.length + '. Hero ' + run.hp + ' / ' + run.maxHp + (out.heal ? ' (healed ' + out.heal + ')' : '') + '.</p>';
  h += '<p class="gold">+' + out.coins + ' coins' + (out.tile ? ' and a colourless tile' : '') + '</p>' + (out.tile ? '<div class="inv">' + resTile(out.tile) + '</div>' : '');
  if (out.mom) h += '<p><span class="mombadge" data-card="mom">Momentum +' + out.mom + '</span><br><span class="ctext">Cleared in one attack: your next fight\'s first attack gets +' + out.mom + ' on every tile.</span></p>';
  h += '<div class="btns"><button class="btn main" data-act="cont">' + (out.boss ? 'Go deeper' : 'Continue') + '</button>' + (out.boss ? '<button class="btn" data-act="bank">Bank and leave</button>' : '') + '</div></div>';
  $('#result').innerHTML = h; show('result');
}
function commitRun(how) {
  var run = S.run, k = settle(run, how);
  store.coins += k.coins; k.tiles.forEach(function (t) { store.inv.push({ s: t.s, n: t.n }); });
  if (run.depth > (store.best[run.area] || 0)) store.best[run.area] = run.depth;
  save(); return k;
}
function endRun(reason) {
  var run = S.run, k = commitRun('dead'); S.phase = 'over';
  var h = '<div class="resbox lose"><h2>Run over</h2><p>' + (reason === 'hp' ? 'Your hero ran out of HP.' : 'Your bag is empty.') + '</p><p>Fights won: <b>' + run.fights + '</b>, depth <b>' + run.depth + '</b>.</p><p class="gold">Kept ' + k.coins + ' of ' + run.coins + ' coins' + (run.loot.length ? ' and ' + k.tiles.length + ' of ' + run.loot.length + ' loot tiles' : '') + '.</p><div class="btns"><button class="btn main" data-act="home">Home</button></div></div>';
  $('#result').innerHTML = h; S.run.over = reason; show('result');
}
function bankRun() {
  var run = S.run, k = commitRun('bank'); S.phase = 'over'; run.over = 'bank';
  $('#result').innerHTML = '<div class="resbox win"><h2>Banked</h2><p>Fights won: <b>' + run.fights + '</b>, depth <b>' + run.depth + '</b>.</p><p class="gold">+' + k.coins + ' coins' + (k.tiles.length ? ' and ' + k.tiles.length + ' colourless tile' + (k.tiles.length > 1 ? 's' : '') : '') + ' saved.</p><div class="btns"><button class="btn main" data-act="home">Home</button></div></div>';
  show('result');
}

/* ---------- cards ---------- */
function hideCard() { var c = $('#card'); c.hidden = true; if ($('#modal').hidden) $('#dim').hidden = true; }
function showCard(html) { $('#card').innerHTML = html; $('#card').hidden = false; $('#dim').hidden = false; }
function tileCardHTML(t, parts, extra) {
  var h = tileHTML(t, { cls: 'cardtile' }).replace('class="tile', 'class="cardtile tile') + '<h3>' + COLORS[t.c] + ' ' + SHAPES[t.s].name + ' ' + tileLabel(t) + '</h3><p>' + SHAPES[t.s].desc + '</p>';
  if (t.c !== 'x') { var u = UNIT_BY_ID[t.u]; if (u) h += '<p><b>' + u.name + '</b> (' + REACTS[u.react].name + '): ' + REACTS[u.react].line + '</p>'; }
  else h += '<p class="muted">Colourless: no reaction, and it does not count as a colour.</p>';
  if (parts) { var rows = parts.filter(function (p) { return p[1] && !(p[0].indexOf('×') >= 0 && p[1] === 1); }); if (rows.length) h += '<table>' + rows.map(function (p) { return '<tr><td>' + p[0] + '</td><td>' + (p[0].indexOf('×') >= 0 ? '×' : '+') + p[1] + '</td></tr>'; }).join('') + '</table>'; }
  return h + (extra || '');
}
function cardFor(key) {
  var p = key.split(':'), run = S.run, h = '';
  if (p[0] === 't') {
    var t = run && tileById(+p[1]); if (!t) return '';
    var cell = S.board.indexOf(t.id), parts = null;
    if (cell >= 0 && S.screen === 'fight') parts = evalNow(true).parts[cell];
    return tileCardHTML(t, parts);
  }
  if (p[0] === 'kt') { var u = UNIT_BY_ID[p[1]]; return tileCardHTML({ c: u.c, u: u.id, s: p[2], n: +p[3] }, null, '<p class="muted">Arrives at unit level ' + p[4] + '.</p>'); }
  if (p[0] === 'it') { var it = store.inv[+p[1]]; return it ? tileCardHTML({ c: 'x', s: it.s, n: it.n }) : ''; }
  if (p[0] === 'ot') { var ot = run.offers[+p[1]].reward.tile; return tileCardHTML({ c: 'x', s: ot.s, n: ot.n }, null, '<p class="muted">Reward: goes into your inventory when the run ends.</p>'); }
  if (p[0] === 'e' || p[0] === 'oe') {
    var e = p[0] === 'e' ? S.fs.F.enemies[+p[1]] : run.offers[+p[1]].F.enemies[+p[2]];
    h = '<h3>' + (e.boss ? 'Boss' : e.kind === 'g' ? 'Guard' : e.w > 1 ? 'Wide enemy' : 'Enemy') + '</h3><p>HP <b>' + (e.dead ? 0 : e.hp) + '</b>. Attack <b>' + e.atk + '</b>: if it survives your attack it hits your hero for that much.</p>';
    if (e.kind === 'g') h += '<p>Guard: takes damage only if at least 2 separate tiles hit it in one attack.</p>';
    if (e.w > 1) h += '<p>Wide: covers ' + e.w + ' columns with one shared HP pool.</p>';
    if (e.boss) h += '<p>' + (e.phase === 2 ? 'Second phase.' : 'When its HP runs out it rises once more with ' + Math.max(e.ph2, 0) + ' HP.') + '</p>';
    return h + '<p class="muted">HP stays between attacks.</p>';
  }
  if (p[0] === 'bc') return '<h3>Bonus cell ' + bcText(p[1]) + '</h3><p>' + (p[1] === 'x2' ? 'A Strike, Fork or booster placed here is doubled.' : 'A Strike, Fork or booster placed here gets ' + bcText(p[1]) + '.') + '</p><p class="muted">Applies before Doubles and boosters. Doubles ignore it.</p>';
  if (p[0] === 'rx' || p[0] === 'ru') {
    var uu = p[0] === 'rx' ? UNIT_BY_ID[run.team[p[1]]] : UNIT_BY_ID[p[1]], R = REACTS[uu.react];
    return '<h3>' + dotHTML(uu.c) + ' ' + uu.name + ': ' + R.name + '</h3><p>' + R.line + '.</p><p class="muted">' + R.hint + ' A unit\'s reaction says what its tiles gain from the tiles around them. Always extra damage.</p>';
  }
  if (p[0] === 'mom') return '<h3>Momentum</h3><p>You cleared the last fight in one attack. Every tile gets +' + CONFIG.momentum.bonus + ' on the first attack of this fight.</p>';
  return '';
}

/* ---------- pointer handling ---------- */
var P = null, ghost = null, lpAt = 0;
function targetOf(el) {
  if (!el || !el.closest) return null;
  var x, tg = { card: null };
  var cardEl = el.closest('[data-card]'); if (cardEl) tg.card = cardEl.dataset.card;
  if (S.screen === 'fight' && S.phase === 'edit') {
    if ((x = el.closest('[data-h]'))) { tg.kind = 'hand'; tg.id = +x.dataset.h; tg.el = x; return tg; }
    if ((x = el.closest('.tile[data-cell]'))) { tg.kind = 'board'; tg.cell = +x.dataset.cell; tg.id = S.board[tg.cell]; tg.el = x; return tg; }
    if ((x = el.closest('.cell[data-cell]'))) { tg.kind = 'cell'; tg.cell = +x.dataset.cell; tg.el = x; return tg; }
  }
  if (cardEl) { tg.kind = 'card'; tg.el = cardEl; return tg; }
  return null;
}
function longPress() {
  if (!P || !P.tg.card) return; P.long = true; lpAt = Date.now();
  var h = cardFor(P.tg.card); if (!h) return; showCard(h);
  if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {}
}
document.addEventListener('pointerdown', function (e) {
  if (!$('#card').hidden) { hideCard(); P = { dead: true }; lpAt = Date.now(); return; }
  if (S.phase === 'anim' && S.screen === 'fight') { S.skip = true; return; }
  if (!$('#modal').hidden && !$('#modal').contains(e.target)) return;
  var tg = targetOf(e.target); if (!tg) { P = null; return; }
  P = { tg: tg, x: e.clientX, y: e.clientY, moved: false, long: false };
  if (tg.card) P.timer = setTimeout(longPress, CONFIG.longPressMs);
  if (tg.kind === 'cell' && S.sel >= 0) { /* preview already shown */ }
});
document.addEventListener('pointermove', function (e) {
  if (!P || P.dead || P.long) return;
  var dx = e.clientX - P.x, dy = e.clientY - P.y;
  if (!P.moved && dx * dx + dy * dy > 100 && (P.tg.kind === 'hand' || P.tg.kind === 'board')) {
    P.moved = true; clearTimeout(P.timer);
    ghost = P.tg.el.cloneNode(true); ghost.classList.add('ghost'); ghost.removeAttribute('data-h'); ghost.removeAttribute('data-cell'); ghost.removeAttribute('data-card');
    document.body.appendChild(ghost);
    if (P.tg.kind === 'board') P.tg.el.classList.add('dragging');
    S.sel = -1; $$('#fhand .tile.sel').forEach(function (n) { n.classList.remove('sel'); });
    showHold(tileById(P.tg.id), P.tg.kind === 'board' ? P.tg.cell : -1);
  }
  if (P.moved && ghost) { ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px'; }
});
function endPointer(e, cancel) {
  if (!P) return;
  var p = P; P = null; clearTimeout(p.timer);
  if (p.dead) return;
  if (ghost) { ghost.remove(); ghost = null; }
  if (p.tg.kind === 'board' && p.tg.el) p.tg.el.classList.remove('dragging');
  if (cancel) { if (p.moved) { clearHold(); renderFight(); } return; }
  if (p.long) return;
  var tg = p.tg;
  if (p.moved) {
    clearHold();
    var under = document.elementFromPoint(e.clientX, e.clientY), cell = under && under.closest && under.closest('.cell[data-cell]');
    if (cell) place(tg.id, +cell.dataset.cell);
    else if (tg.kind === 'board' && under && under.closest && under.closest('#fhand,#ftabs')) unplace(tg.cell);
    else renderFight();
    return;
  }
  if (S.screen !== 'fight' || S.phase !== 'edit') return;
  if (tg.kind === 'hand') { S.sel = S.sel === tg.id ? -1 : tg.id; clearHold(); renderFight(); }
  else if (tg.kind === 'cell') { if (S.sel >= 0 && S.fs.F.blocked.indexOf(tg.cell) < 0) place(S.sel, tg.cell); else { tg.el.classList.remove('shake'); void tg.el.offsetWidth; tg.el.classList.add('shake'); } }
  else if (tg.kind === 'board') { if (S.sel >= 0) place(S.sel, tg.cell); else unplace(tg.cell); }
}
document.addEventListener('pointerup', function (e) { endPointer(e, false); });
document.addEventListener('pointercancel', function (e) { endPointer(e, true); });
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ---------- modals ---------- */
function openModal(html) { $('#modal').innerHTML = html; $('#modal').hidden = false; $('#dim').hidden = false; }
function closeModal() { $('#modal').hidden = true; if ($('#card').hidden) $('#dim').hidden = true; }
function helpHTML() {
  return '<h3>How to play</h3><ol>' +
    '<li>Enemies sit above the columns with <b>HP</b> and an <b>attack</b>. Place tiles, press <b>Attack</b>. Each column\'s total hits its enemy. HP stays between attacks; survivors then hit your hero.</li>' +
    '<li>Tap a tile, then a cell, or drag it. Tap a placed tile to take it back. Hold anything for a card.</li>' +
    '<li><b>Strike</b> hits its own column. <b>Fork</b> hits both neighbours. <b>Plus</b> and <b>Row</b> boost Strikes and Forks. <b>Double</b> doubles the tile in front of it.</li>' +
    '<li>Your team is five units, one per colour. A unit\'s reaction says what its tiles gain from the tiles around them. The five reactions are listed under the board.</li>' +
    '<li><b>Every tile you attack with is spent</b> for the rest of the run. Win with as few as you can. Beating a boss brings them all back, sometimes with extra.</li>' +
    '<li>Guard enemies need 2 hits at once. Bonus cells (+1, +2, ×2) boost the tile on them. Winning in one attack gives momentum for the next fight.</li>' +
    '<li>Bank your loot and leave at any time, or go deeper. Dying keeps only part of it.</li></ol><div class="btnrow"><button class="btn main" data-act="close">Got it</button></div>';
}
function settingsHTML() {
  var h = '<h3>Settings and test</h3><div class="set"><label>Momentum</label><input type="checkbox" id="setmom"' + (store.set.momentum ? ' checked' : '') + '> <select id="setmomv">' + CONFIG.momentum.values.map(function (v) { return '<option' + (v === store.set.value ? ' selected' : '') + '>' + v + '</option>'; }).join('') + '</select></div>';
  h += '<div class="btnrow"><button class="btn sm" data-act="unlockall">Unlock all units</button><button class="btn sm" data-act="coins">+100 coins</button><button class="btn sm" data-act="tiles">+3 colourless tiles</button></div>';
  h += '<div class="muted" style="font-size:12px">Coins: ' + store.coins + '. Set a unit level (0 = locked):</div>';
  UNITS.forEach(function (u) { var st = store.units[u.id]; h += '<div class="set">' + dotHTML(u.c) + '<label>' + u.name + '</label><select data-ulv="' + u.id + '">' + [0, 1, 2, 3].map(function (l) { return '<option value="' + l + '"' + ((st.u ? st.l : 0) === l ? ' selected' : '') + '>' + (l ? 'Level ' + l : 'Locked') + '</option>'; }).join('') + '</select></div>'; });
  h += '<div class="btnrow"><button class="btn sm" data-act="reset">Reset save</button><button class="btn main sm" data-act="close">Close</button></div>';
  return h;
}

/* ---------- clicks ---------- */
document.addEventListener('click', function (e) {
  if (Date.now() - lpAt < 450) { e.stopPropagation(); e.preventDefault(); return; }
  var t = e.target, el;
  if (!$('#card').hidden) return;
  if ((el = t.closest && t.closest('[data-tab]'))) { S.tab = el.dataset.tab; S.sel = -1; clearHold(); renderFight(); return; }
  if ((el = t.closest && t.closest('[data-inv]'))) {
    var i = +el.dataset.inv, at = store.bag.indexOf(i);
    if (at >= 0) store.bag.splice(at, 1); else if (store.bag.length < CONFIG.maxColourless) store.bag.push(i); else { store.bag.shift(); store.bag.push(i); }
    save(); show(S.screen); return;
  }
  if ((el = t.closest && t.closest('[data-offer]'))) { startFightUI(+el.dataset.offer); return; }
  el = t.closest && t.closest('[data-act],#fatk,#fclear'); if (!el) return;
  var act = el.dataset.act || el.id;
  switch (act) {
    case 'start': startRunUI(+el.dataset.area); break;
    case 'team': show('team'); break;
    case 'home': show('home'); break;
    case 'help': openModal(helpHTML()); break;
    case 'settings': openModal(settingsHTML()); break;
    case 'close': closeModal(); break;
    case 'pick': store.team[UNIT_BY_ID[el.dataset.u].c] = el.dataset.u; save(); renderTeam(); break;
    case 'unlock': if (store.coins >= CONFIG.unlockCost) { store.coins -= CONFIG.unlockCost; store.units[el.dataset.u].u = true; save(); renderTeam(); } break;
    case 'level': var us = store.units[el.dataset.u], cost = CONFIG.levelCost[us.l + 1]; if (us.l < 3 && store.coins >= cost) { store.coins -= cost; us.l++; save(); renderTeam(); } break;
    case 'cont': show('map'); break;
    case 'bank': bankRun(); break;
    case 'leave': openModal('<h3>Leave the run?</h3><p style="font-size:14px;color:var(--ink)">You bank everything you collected so far.</p><div class="btnrow"><button class="btn main" data-act="bank">Bank and leave</button><button class="btn" data-act="close">Keep playing</button></div>'); break;
    case 'fmenu': openModal('<h3>Run menu</h3><p style="font-size:14px;color:var(--ink)">Leaving banks your coins and loot so far. The current fight is abandoned.</p><div class="btnrow"><button class="btn" data-act="help">How to play</button><button class="btn" data-act="bank">Bank and leave</button><button class="btn main" data-act="close">Back to fight</button></div>'); break;
    case 'fatk': attack(); break;
    case 'fclear': clearBoard(); break;
    case 'unlockall': UNITS.forEach(function (u) { store.units[u.id].u = true; }); save(); $('#modal').innerHTML = settingsHTML(); break;
    case 'coins': store.coins += 100; save(); $('#modal').innerHTML = settingsHTML(); break;
    case 'tiles': for (var q = 0; q < 3; q++) store.inv.push(genColourless(1, Math.random)); save(); $('#modal').innerHTML = settingsHTML(); break;
    case 'reset': if (el.dataset.sure) { try { localStorage.removeItem(LS_KEY); } catch (er) {} store = defaultStore(); applySettings(); save(); closeModal(); show('home'); } else { el.dataset.sure = 1; el.textContent = 'Tap again to confirm'; } break;
  }
  if ((act === 'bank' || act === 'help' || act === 'cont') && !$('#modal').hidden && act !== 'help') closeModal();
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'setmom') { store.set.momentum = t.checked; applySettings(); save(); }
  else if (t.id === 'setmomv') { store.set.value = +t.value; applySettings(); save(); }
  else if (t.dataset && t.dataset.ulv) { var st = store.units[t.dataset.ulv], v = +t.value; st.u = v > 0; if (v > 0) st.l = v; if (!st.u && store.team[UNIT_BY_ID[t.dataset.ulv].c] === t.dataset.ulv) { store.team[UNIT_BY_ID[t.dataset.ulv].c] = UNITS.filter(function (u) { return u.c === UNIT_BY_ID[t.dataset.ulv].c && store.units[u.id].u; }).map(function (u) { return u.id; })[0] || t.dataset.ulv; } save(); renderHome(); }
});
$('#dim').addEventListener('click', function () { if (!$('#card').hidden) return; closeModal(); });
window.addEventListener('resize', function () { if (S.screen === 'fight' && S.phase === 'edit') renderFight(); });
show('home');
window.TR = { S: S, CONFIG: CONFIG, store: function () { return store; }, setSpeed: function (v) { SPEED = v; }, startRun: startRunUI, chooseOffer: startFightUI, place: place, attack: attack, render: renderFight, show: show, save: save, UNITS: UNITS };
})();
</script>
</body>
</html>
