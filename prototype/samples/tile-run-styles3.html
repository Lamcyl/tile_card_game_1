<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Tile Run: enemy bar variants of the puzzle look</title>
<style>
:root{--cbg:#e6eaf0;--cink:#1c2635;--cmut:#566377;--cline:#c9d1dc;--cpanel:#fff;--cbtn:#1c2635;--cbtnink:#fff}
@media (prefers-color-scheme:dark){:root{--cbg:#0f131b;--cink:#eef2f8;--cmut:#a6b1c4;--cline:#3a4560;--cpanel:#212838;--cbtn:#eef2f8;--cbtnink:#151a24}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--cbg);color:var(--cink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
#tabs{position:sticky;top:0;z-index:20;display:flex;gap:4px;padding:8px 10px;background:var(--cbg);border-bottom:1px solid var(--cline);max-width:430px;margin:0 auto}
#tabs button{flex:1;min-width:0;height:40px;border-radius:12px;border:2px solid var(--cline);background:var(--cpanel);font-weight:800;font-size:14px;padding:0}
#tabs button[aria-selected=true]{background:var(--cbtn);color:var(--cbtnink);border-color:var(--cbtn)}
.wrap{max-width:430px;margin:0 auto}
.panel[hidden]{display:none}
.ptitle{padding:10px 14px 8px;font-size:13px;color:var(--cmut)}
.ptitle b{color:var(--cink);font-size:15px}
.notes{padding:12px 16px 28px;font-size:13px;line-height:1.45;color:var(--cmut)}
.notes p{margin:0 0 6px}
.notes b{color:var(--cink)}

/* ---------- mockup (shared structure) ---------- */
.m{--gap:6px;--rad:12px;--cols:5;padding:2px 12px 14px;background:var(--bg);color:var(--ink);position:relative}
.m *{box-sizing:border-box}
.m .hd{display:flex;align-items:center;gap:8px;height:44px}
.m .hb{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--panel);border:2px solid var(--line);padding:0}
.m .hb svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.m .ttl{flex:1;text-align:center;font-weight:800;font-size:17px}
.m .ttl small{display:block;font-weight:600;font-size:11px;color:var(--muted);margin-top:1px}
.m .hint{min-height:30px;font-size:13px;line-height:1.3;color:var(--muted);text-align:center;padding:0 4px 4px}
.m .enemies,.m .board,.m .hand{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:var(--gap)}
.m .enemy{display:flex;flex-direction:column;gap:3px;min-width:0}
.m .etile{position:relative;height:54px;border-radius:var(--rad);background:var(--enemy);color:var(--enemyink);border:3px solid var(--enemy);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.m .etile b{font-size:28px;line-height:.95;font-weight:800;font-variant-numeric:tabular-nums}
.m .etile i{font-style:normal;font-size:8.5px;font-weight:800;letter-spacing:.06em;opacity:.85;white-space:nowrap}
.m .etile em,.m .ebar{display:none}
.m .pill{height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:13px;background:var(--panel2);color:var(--ink);border:2px solid var(--line);padding:0 4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.m .pill small{font-size:10px;font-weight:700;color:var(--muted)}
.m .enemy.ok .pill{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.m .enemy.ok .pill small{color:var(--ok)}
.m .enemy.tgt .etile{outline:3px solid var(--gold);outline-offset:1px}
.m .boardwrap{margin-top:8px}
.m .cell{border-radius:var(--rad);background:var(--cellbg);border:2px dashed var(--line);aspect-ratio:1/1;transition:background .1s}
.m .cell.x{border:2px solid var(--line);background:repeating-linear-gradient(45deg,var(--panel2) 0 6px,var(--cellbg) 6px 12px)}
.m .cell.aff{background:color-mix(in srgb,var(--gold) 38%,var(--cellbg));border-color:var(--gold);border-style:solid}

.m .tile{position:relative;border-radius:var(--rad);display:flex;align-items:center;justify-content:center;background:var(--tf);color:var(--ti);box-shadow:var(--tsh);cursor:pointer;min-width:0;align-self:stretch;-webkit-user-select:none;user-select:none}
.m .hand .tile,.m .hand .slot{aspect-ratio:1/1}
.m .slot{border-radius:var(--rad)}
.m .slot.empty{border:2px dashed var(--line);opacity:.6}
.m .c-r{--tc:var(--r);--tf:var(--rf);--ti:var(--ri)}
.m .c-b{--tc:var(--b);--tf:var(--bf);--ti:var(--bi)}
.m .c-g{--tc:var(--g);--tf:var(--gf);--ti:var(--gi)}
.m .c-y{--tc:var(--y);--tf:var(--yf);--ti:var(--yi)}
.m .c-p{--tc:var(--p);--tf:var(--pf);--ti:var(--pi)}
.m .c-n{--tc:var(--n);--tf:var(--nf);--ti:var(--ni)}
.m .tile.k-boost,.m .tile.k-mult{background:var(--panel);color:var(--tx);border:3px solid var(--tx)}
.m .tile.k-mult{border-style:dashed}
.m .tile.k-boost,.m .tile.k-mult{--gl:var(--tx);--sy:var(--tx)}
.m .c-r{--tx:var(--rx)}.m .c-b{--tx:var(--bx)}.m .c-g{--tx:var(--gx)}.m .c-y{--tx:var(--yx)}.m .c-p{--tx:var(--px)}.m .c-n{--tx:var(--nx)}
.m .tile .num{font-size:var(--numsz,29px);line-height:1;font-weight:800;margin-top:-4px;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.m .tile.k-boost .num,.m .tile.k-mult .num{font-size:calc(var(--numsz,29px) - 4px);margin-top:3px}
.m .tile .glyph{position:absolute;left:5px;top:5px;width:20px;height:20px;color:var(--gl)}
.m .tile .sym{position:absolute;right:5px;top:5px;width:12px;height:12px;color:var(--sy)}
.m .tile .nm{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-style:normal;font-size:9px;font-weight:800;letter-spacing:.05em;white-space:nowrap}
.m .tile .chg{position:absolute;left:0;right:0;bottom:3px;margin:auto;width:max-content;max-width:94%;font-style:normal;font-size:10.5px;font-weight:800;line-height:1;white-space:nowrap;display:none;font-variant-numeric:tabular-nums}
.m .tile .chg s{opacity:.75;font-weight:700;margin-right:2px;text-decoration-thickness:1.5px}
.m .tile.has-chg .chg{display:block}
.m .tile.has-chg .nm{display:none}
.m .tile .mk{position:absolute;display:none;pointer-events:none}
.m .tile .mk.dot.u{top:3px;left:50%;transform:translateX(-50%)}
.m .tile .mk.dot.d{bottom:3px;left:50%;transform:translateX(-50%)}
.m .tile .mk.dot.l{left:3px;top:50%;transform:translateY(-50%)}
.m .tile .mk.dot.r{right:3px;top:50%;transform:translateY(-50%)}
.m .tile .mk svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.m .tile.aff{outline:3px solid var(--gold);outline-offset:1px}
.m .tile.sel{outline:3px solid var(--ink);outline-offset:2px;z-index:2}
.m .tile.brL::after,.m .tile.brR::after{content:"";position:absolute;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--gold)}
.m .tile.brL::after{right:calc(var(--gap) / -2 - 1.5px)}
.m .tile.brR::after{left:calc(var(--gap) / -2 - 1.5px)}
.m .poly{background:none!important;box-shadow:none!important;border:0!important;color:var(--ti)}
.m .poly>svg.body{position:absolute;inset:0;width:100%;height:100%;overflow:visible;fill:var(--tf);stroke:var(--tf);stroke-width:24;stroke-linejoin:round;filter:drop-shadow(0 2px 0 var(--shadowc))}
.m .poly .num{font-size:26px;position:absolute;left:52%;top:2%;width:48%;height:48%;display:flex;align-items:center;justify-content:center;margin:0}
.m .poly .glyph{left:5px;top:4px;width:18px;height:18px}
.m .tile.poly .sym{right:auto;bottom:auto;left:76%;top:77%;transform:translate(-50%,-50%)}
.m .poly>svg.ring{display:none;fill:currentColor;stroke:currentColor;stroke-width:30;stroke-linejoin:round;opacity:.22;color:var(--ti)}
.m .poly .nm,.m .poly .chg{display:none!important}

.m .goals{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.m .goal{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:2px 8px 2px 5px;white-space:nowrap}
.m .goal svg{width:13px;height:13px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linejoin:round}
.m .goal.live{border-color:var(--ok);color:var(--ok)}.m .goal.live svg{fill:var(--gold);stroke:var(--gold)}
.m .hero{display:flex;align-items:center;gap:8px;margin-top:10px}
.m .hero>svg{flex:none;width:20px;height:20px;fill:var(--r);color:var(--r)}
.m .hpbar{flex:1;height:14px;border-radius:7px;background:var(--panel2);border:2px solid var(--line);overflow:hidden}
.m .hpbar u{display:block;height:100%;background:var(--hpc);width:75%}
.m .hpn{flex:none;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;min-width:44px}
.m .hpn small{color:var(--muted);font-weight:700}
.m .abil{flex:none;height:36px;padding:0 12px;border-radius:12px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);color:var(--ink)}
.m .abil svg{width:14px;height:14px;fill:none;stroke:var(--g);stroke-width:3;stroke-linecap:round}
.m .abil small{font-size:10px;color:var(--muted);font-weight:700}
.m .hand{margin-top:10px}
.m .bar{display:flex;gap:10px;margin-top:12px}
.m .bar button{height:50px;border-radius:14px;font-weight:800;font-size:17px;padding:0;border:2px solid var(--line);background:var(--panel);color:var(--ink)}
.m .bar .clear{flex:1;font-size:15px}
.m .bar .go{flex:2.4;background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.m .bar .go small{font-weight:600;opacity:.8;font-size:12px;margin-left:4px}

/* ---------- palettes ---------- */
.m{--r:#d2473f;--b:#2e6bd3;--g:#23874f;--y:#b9800f;--p:#7a55c2;--n:#566377;
 --rf:var(--r);--bf:var(--b);--gf:var(--g);--yf:var(--y);--pf:var(--p);--nf:var(--n);
 --rx:var(--r);--bx:var(--b);--gx:var(--g);--yx:var(--y);--px:var(--p);--nx:var(--n);
 --ri:#fff;--bi:#fff;--gi:#fff;--yi:#fff;--pi:#fff;--ni:#fff;--gl:#fff;--sy:#fff;
 --bg:#eef1f5;--panel:#fff;--panel2:#e4e9f0;--ink:#1c2635;--muted:#566377;--line:#c9d1dc;--cellbg:#f8fafc;
 --ok:#1b8a4a;--okbg:#dff3e6;--gold:#e0a100;--enemy:#33405a;--enemyink:#fff;--btn:#1c2635;--btnink:#fff;
 --shadowc:rgba(20,30,50,.18);--tsh:0 2px 0 var(--shadowc);--hpc:var(--r)}
@media (prefers-color-scheme:dark){.m{--r:#e0584f;--b:#4f86e6;--g:#2f9d5f;--y:#d19a22;--p:#9a78e0;--n:#7a879c;
 --bg:#151a24;--panel:#212838;--panel2:#2b3448;--ink:#eef2f8;--muted:#a6b1c4;--line:#3a4560;--cellbg:#1b2130;
 --ok:#4cc27c;--okbg:#1f3a2c;--gold:#f0b429;--enemy:#3b4a69;--btn:#eef2f8;--btnink:#151a24;--shadowc:rgba(0,0,0,.5)}}


/* ===== round three: only the enemy area and the hero bar vary ===== */
.m .enemy{position:relative}
.m .etile i.gl{font-size:8px;letter-spacing:.01em}
.m .chk{position:absolute;top:-8px;right:-7px;width:19px;height:19px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);z-index:3}
.m .chk svg{width:10px;height:10px;fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.m .enemy.ok .etile{border-color:var(--ok)}
.m .etile em{display:block;font-style:normal;font-size:10.5px;font-weight:800;opacity:.9;font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:2px}
.m .enemy.ok .etile em{color:#8fe3b0;opacity:1}
.m .etile{height:66px;gap:0}
.m .etile i{margin-bottom:1px}
.m .tbar,.m .tick{display:block}
.m .tbar{position:relative;height:7px;border-radius:4px;background:var(--panel2);overflow:visible;margin-top:1px}
.m .tbar u{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--muted)}
.m .tbar u+u{background:color-mix(in srgb,var(--ok) 55%,#fff)}
.m .enemy.ok .tbar u{background:var(--ok)}
.m .enemy.ok .tbar u+u{background:color-mix(in srgb,var(--ok) 55%,#fff)}
.m .tbar .ovr{position:absolute;right:-3px;top:-3px;bottom:-3px;width:6px;border-radius:3px;background:var(--gold);border:1.5px solid var(--bg)}
.m .tbar .tk{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--bg)}
.m .tbar.seg{height:10px;border-radius:5px;overflow:hidden}
.m .tbar.seg u{border-radius:0}
/* e2 pill bar */
.e2 .etile{height:48px}.e2 .etile b{font-size:25px}.e2 .etile em{display:none}
.m .pbar{position:relative;height:22px;border-radius:11px;background:var(--panel2);border:2px solid var(--line);overflow:hidden;margin-top:1px}
.m .pbar u{position:absolute;left:0;top:0;bottom:0;background:var(--muted)}
.m .enemy.ok .pbar{border-color:var(--ok)}.m .enemy.ok .pbar u{background:var(--ok)}
.m .pbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.m .pbar span.inv{color:#fff}
/* e3 inside the slab, bar along the bottom */
.e3 .etile{height:70px;justify-content:center;padding-bottom:6px}
.m .ebar{display:none;position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.18)}
.e3 .ebar{display:block}
.m .ebar u{display:block;height:100%;background:#fff}
.m .enemy.ok .ebar u{background:#6be09a}
.m .ebar .ovr{position:absolute;right:0;top:0;bottom:0;width:6px;background:var(--gold)}
/* e5 two tone with numbers at both ends */
.m .ends{display:flex;justify-content:space-between;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:3px;color:var(--muted);white-space:nowrap}
.m .ends b{color:var(--ink)}
.m .enemy.ok .ends .r{color:var(--ok)}
.m .ends .over{color:#a06a00}
.e5 .etile{height:56px}.e5 .etile em{display:none}
.e5 .tbar{height:9px;border-radius:5px;background:repeating-linear-gradient(90deg,var(--panel2) 0 4px,color-mix(in srgb,var(--panel2) 70%,var(--line)) 4px 8px)}
.e5 .tbar u{background:var(--ink)}
.e5 .enemy.ok .tbar u{background:var(--ok)}
/* e6 bar inside the slab above the number, guard pips */
.e6 .etile em{display:none}
.m .ibar{display:flex;align-items:center;gap:4px;width:84%;margin:1px 0 2px}
.m .ibar .in{position:relative;flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.m .ibar .in u{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:3px}
.m .enemy.ok .ibar .in u{background:#6be09a}
.m .pip{width:8px;height:8px;border-radius:50%;border:1.5px solid #fff;flex:none}
.m .pip.on{background:#6be09a;border-color:#6be09a}
.m .sub{text-align:center;font-size:11.5px;font-weight:800;color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums;white-space:nowrap}
.m .enemy.ok .sub{color:var(--ok)}
.e6 .etile{height:62px}
/* e7 light slab, shared bar */
.e7 .etile{background:var(--panel);color:var(--ink);border:2px solid var(--line);height:56px;box-shadow:0 2px 0 var(--shadowc)}
.e7 .etile b{color:var(--ink)}
.e7 .etile em{display:none}
.e7 .enemy.ok .etile{border-color:var(--ok)}
.e7 .tbar{height:9px;border-radius:5px}
.e7 .tbar u{background:var(--enemy)}
.e7 .tbar u+u{background:color-mix(in srgb,var(--enemy) 50%,#fff)}
.e7 .enemy.ok .tbar u{background:var(--ok)}
.e7 .enemy.ok .tbar u+u{background:color-mix(in srgb,var(--ok) 50%,#fff)}
/* hero bars */
.m .hpn{min-width:0}
.h1 .hpbar{height:7px;border:0;border-radius:4px}
.h2 .hpbar{height:22px;border-radius:11px;position:relative;overflow:hidden}
.h2 .hpbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;color:var(--ink)}
.h2 .hpbar span.inv{color:#fff}
.h2 .hpn{display:none}
.h3 .hpbar{height:34px;border-radius:12px;background:var(--enemy);border:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px}
.h3 .hpbar u{position:absolute;left:0;right:auto;bottom:0;top:auto;height:6px;background:#fff;width:75%}
.h3 .hpbar small{opacity:.75;font-weight:700}
.h3 .hpn{display:none}
.h4 .hpbar{height:12px;border-radius:6px;position:relative}
.h4 .hpbar u{border-radius:0}
.h4 .hpbar .tk{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--bg)}
.h5 .hpbar{height:9px;border-radius:5px;border:0;background:repeating-linear-gradient(90deg,var(--panel2) 0 4px,color-mix(in srgb,var(--panel2) 70%,var(--line)) 4px 8px)}
.h5 .hpbar u{background:var(--r)}
.h6 .hpmid{flex:1;display:flex;flex-direction:column;gap:3px}
.h6 .hpbar{height:7px;border:0;flex:none}
.h6 .hpn{text-align:center;font-size:12px}
.h7 .hpmid{flex:1;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 0 var(--shadowc)}
.h7 .hpbar{height:9px;border-radius:5px;border:0}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs>
  <symbol id="s-r" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4.2"/></symbol>
  <symbol id="s-b" viewBox="0 0 10 10"><path d="M5 .6 L9.6 9 L.4 9Z"/></symbol>
  <symbol id="s-g" viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" rx="1.2"/></symbol>
  <symbol id="s-y" viewBox="0 0 10 10"><path d="M5 .4 L9.6 5 L5 9.6 L.4 5Z"/></symbol>
  <symbol id="s-p" viewBox="0 0 10 10"><path d="M5 .5 L9 3.4 L7.5 9 L2.5 9 L1 3.4Z"/></symbol>
  <symbol id="s-n" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.4" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
 </defs>
</svg>
<nav id="tabs" role="tablist" aria-label="Variations"></nav>
<div class="wrap" id="panels"></div>

<script>
/* ===== content shared by every tab ===== */
var COLS = { r:'r', b:'b', g:'g', y:'y', p:'p', n:'n' };
// board tiles: r,c = top-left; shape cells in [dr,dc]; reach: attack = lanes of f,l,r ; others = sides u,d,l,r
var BOARD = [
 {id:'red',   k:'a', c:'r', n:5, r:0, c0:0, w:2, cells:[[0,0],[0,1]], reach:'f',  name:'PAIR'},
 {id:'fork',  k:'a', c:'b', n:4, r:0, c0:2, reach:'lr', name:'FORK'},
 {id:'yel',   k:'a', c:'y', n:5, base:3, how:'+2', r:0, c0:3, reach:'f', name:'STRIKE'},
 {id:'b1',    k:'a', c:'b', n:6, base:3, how:'×2', r:1, c0:0, reach:'f', name:'STRIKE', br:'L'},
 {id:'gre',   k:'a', c:'g', n:6, base:3, how:'×2', r:1, c0:1, reach:'f', name:'STRIKE', sand:true},
 {id:'b2',    k:'a', c:'b', n:3, base:1, how:'+2', r:1, c0:2, reach:'f', name:'STRIKE', br:'R'},
 {id:'bst',   k:'boost', c:'y', n:2, r:1, c0:3, reach:'ul', name:'PLUS'},
 {id:'mul',   k:'mult',  c:'p', n:2, r:2, c0:0, reach:'u',  name:'DOUBLE'},
 {id:'cpy',   k:'copy',  c:'n', n:7, r:2, c0:1, reach:'u',  name:'ECHO', lane:true}
];
var BLOCKED = [[0,4]];
var HAND = [
 {k:'a', c:'r', n:4, reach:'f', name:'STRIKE'},

 {k:'mult', c:'y', n:2, reach:'lr', name:'DOUBLE'},
 {k:'a', c:'b', n:3, reach:'lr', name:'FORK'},

/* ===== helpers ===== */
function svgSym(c){ return '<svg class="sym" viewBox="0 0 10 10" fill="currentColor" aria-hidden="true"><use href="#s-'+c+'"/></svg>'; }
// 3x3 glyph. cells: footprint relative to (o) ; reach cells list [row,col] in glyph coords
function glyph(t, o){
  var fp = (t.cells || [[0,0]]).map(function(p){return [p[0]+o[0], p[1]+o[1]];});
  var on = [];
  var has = function(r,c){ return fp.some(function(p){return p[0]===r&&p[1]===c;}); };
  if (t.k === 'a') {
    fp.forEach(function(p){ if (!has(p[0]-1,p[1]) ) { if (t.reach.indexOf('f')>=0) on.push([p[0]-1,p[1]]); } });
    var top = Math.min.apply(null, fp.map(function(p){return p[0];}));
    var tc = fp.filter(function(p){return p[0]===top;}).map(function(p){return p[1];});
    if (t.reach.indexOf('l')>=0) on.push([top-1, Math.min.apply(null,tc)-1]);
    if (t.reach.indexOf('r')>=0) on.push([top-1, Math.max.apply(null,tc)+1]);
    if (t.k==='a' && t.cells && t.cells.length===3) { /* L: lanes of its two top cells handled above */ }
  } else {
    fp.forEach(function(p){
      if (t.reach.indexOf('u')>=0 && !has(p[0]-1,p[1])) on.push([p[0]-1,p[1]]);
      if (t.reach.indexOf('d')>=0 && !has(p[0]+1,p[1])) on.push([p[0]+1,p[1]]);
      if (t.reach.indexOf('l')>=0 && !has(p[0],p[1]-1)) on.push([p[0],p[1]-1]);
      if (t.reach.indexOf('r')>=0 && !has(p[0],p[1]+1)) on.push([p[0],p[1]+1]);
    });
    if (t.lane) fp.forEach(function(p){ if(!has(p[0]-1,p[1])) on.push([p[0]-1,p[1]]); });
  }
  var h = '<svg class="glyph" viewBox="0 0 12 12" aria-hidden="true">';
  for (var r=0;r<3;r++) for (var c=0;c<3;c++){
    if (has(r,c)) { h += '<rect x="'+(c*4+.9)+'" y="'+(r*4+.9)+'" width="2.2" height="2.2" rx=".7" fill="none" stroke="currentColor" stroke-width="1"/>'; continue; }
    var lit = on.some(function(p){return p[0]===r&&p[1]===c;});
    h += '<rect x="'+(c*4+.4)+'" y="'+(r*4+.4)+'" width="3.2" height="3.2" rx=".8" fill="currentColor"'+(lit?'':' opacity=".25"')+'/>';
  }
  return h+'</svg>';
}
function chev(cls, left){ return '<span class="mk chev '+cls+'"'+(left!=null?' style="left:calc('+left+'% - 7px)"':'')+'><svg viewBox="0 0 14 9"><path d="M2 7.5 L7 2 L12 7.5"/></svg></span>'; }
function dot(pos, ch){ return '<span class="mk dot '+pos+'">'+ch+'</span>'; }
function marks(t){
  var h = '', w = t.w || (t.poly ? 2 : 1);
  if (t.k === 'a') {
    if (t.reach.indexOf('f')>=0) for (var j=0;j<w;j++) h += chev('', (j+.5)/w*100);
    if (t.reach.indexOf('l')>=0) h += chev('dl');
    if (t.reach.indexOf('r')>=0) h += chev('dr');
  } else {
    var ch = t.k==='boost' ? '+' : t.k==='mult' ? '×' : '=';
    var s = t.reach;
    if (s.indexOf('u')>=0) h += dot('u', ch);
    if (s.indexOf('d')>=0) h += dot('d', ch);
    if (s.indexOf('l')>=0) h += dot('l', ch);
    if (s.indexOf('r')>=0) h += dot('r', ch);
  }
  return h;
}
function numTxt(t){ return t.k==='boost' ? '+'+t.n : t.k==='mult' ? '×'+t.n : t.n; }
function tileHTML(t, extra){
  var cls = 'tile c-'+t.c+' k-'+t.k+(t.poly?' poly':'')+(t.base!=null||t.sand?' has-chg':'')+(t.br?' br'+t.br:'')+(extra||'');
  var o = t.poly ? [1,0] : t.w===2 ? [1,0] : [1,1];
  var body = '';
  if (t.poly) body = '<svg class="ring" viewBox="0 0 100 100" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible"><polygon points="12,12 88,12 88,88 64,88 64,36 12,36"/></svg><svg class="body" viewBox="0 0 100 100" aria-hidden="true"><polygon points="12,12 88,12 88,88 64,88 64,36 12,36"/></svg>';
  var chg = '';
  if (t.base!=null) chg = '<em class="chg"><s>'+t.base+'</s>'+t.how+'</em>';
  var nm = '<i class="nm">'+t.name+'</i>';
  return '<div class="'+cls+'" data-id="'+(t.id||'')+'" style="'+(t.w===2?'grid-column:'+(t.c0+1)+' / span 2;':'')+(t.id?'grid-row:'+(t.r+1)+';'+(t.w===2?'':'grid-column:'+(t.c0+1)+';'):'')+'">'
   + body + glyph(t,o) + svgSym(t.c) + '<b class="num">'+numTxt(t)+'</b>' + nm + chg + marks(t) + '</div>';
}
var CHK = '<span class="chk"><svg viewBox="0 0 12 12"><path d="M2 6.5l3 3 5-7"/></svg></span>';
function enemyHTML(e, key){
  var tot = e.dmg.reduce(function(x,y){return x+y;},0), ok = tot >= e.hp, over = Math.max(0, tot-e.hp);
  var pct = Math.min(100, tot/e.hp*100), left = Math.max(0, e.hp-tot);
  var fills = '', acc = 0;
  e.dmg.forEach(function(d,i){ var w = Math.min(100-acc, d/e.hp*100); fills = '<u style="left:'+acc+'%;width:'+(i?w:w)+'%"></u>'+fills; acc += w; });
  fills = e.dmg.length>1 ? fills : '<u style="width:'+pct+'%"></u>';
  var ovr = over ? '<span class="ovr"></span>' : '';
  var txt = tot+' / '+e.hp;
  var inner = '', after = '';
  var lab = '<i'+(e.guard?' class="gl"':'')+'>'+e.label+'</i>', big = '<b>'+e.hp+'</b>';
  if (key==='e1') { inner = lab+big+'<em>'+txt+'</em>'; after = '<div class="tbar">'+fills+ovr+'</div>'; }
  if (key==='e2') { inner = lab+big; after = '<div class="pbar"><u style="width:'+pct+'%"></u><span>'+txt+'</span><span class="inv" style="clip-path:inset(0 '+(100-pct)+'% 0 0)">'+txt+'</span></div>'; }
  if (key==='e3') { inner = lab+big+'<em>'+txt+'</em><span class="ebar"><u style="width:'+pct+'%"></u>'+ovr+'</span>'; }
  if (key==='e4') {
    var tk = ''; for (var k=5;k<e.hp;k+=5) tk += '<span class="tk" style="left:'+(k/e.hp*100)+'%"></span>';
    inner = lab+big+'<em>'+txt+'</em>'; after = '<div class="tbar seg">'+fills+tk+'</div>';
  }
  if (key==='e5') {
    inner = lab+big;
    var l = tot ? '<b>−'+tot+'</b>' : '<b>0</b>', r = ok ? '<span class="r">KILL'+(over?' <span class="over">+'+over+'</span>':'')+'</span>' : '<span class="r">'+left+' left</span>';
    after = '<div class="tbar">'+fills+'</div><div class="ends">'+l+r+'</div>';
  }
  if (key==='e6') {
    var pips = e.guard ? [0,1].map(function(i){return '<span class="pip'+(i<e.guard[0]?' on':'')+'"></span>';}).join('') : '';
    var lb = e.guard ? 'GUARD' : e.label;
    inner = '<i>'+lb+'</i><div class="ibar">'+pips+'<span class="in"><u style="width:'+pct+'%"></u></span></div>'+big;
    after = '<div class="sub">'+txt+(over?' <span style="color:#a06a00">+'+over+'</span>':'')+'</div>';
  }
  if (key==='e7') {
    inner = lab+big;
    var sh = e.dmg.length>1 ? e.dmg.join(' + ')+' / '+e.hp : txt;
    after = '<div class="tbar">'+fills+ovr+'</div><div class="sub">'+sh+'</div>';
  }
  return '<div class="enemy'+(ok?' ok':'')+'" data-c="'+e.c+'" data-w="'+e.w+'" style="grid-column:'+(e.c+1)+' / span '+e.w+'">'
   + (ok?CHK:'') + '<div class="etile">'+inner+'</div>' + after + '</div>';
}
var IC = {
 back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
 menu:'<svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg>',
 star:'<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.6.7-5 4.5 1.5 6.6L12 17l-6 3.5 1.5-6.6-5-4.5 6.6-.7z"/></svg>',
 heart:'<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.800-8 11-8 11z"/></svg>',
 plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'
};
function hero(k){
  var hp = 18, mx = 24, pct = hp/mx*100, txt = hp+' / '+mx, h = IC.heart;
  var abil = '<button class="abil">'+IC.plus+'Mend<small>1×</small></button>';
  var num = '<span class="hpn">18<small> / 24</small></span>';
  var bar = '<div class="hpbar"><u style="width:75%"></u></div>';
  if (k==='e2') bar = '<div class="hpbar"><u style="width:75%"></u><span>'+txt+'</span><span class="inv" style="clip-path:inset(0 25% 0 0)">'+txt+'</span></div>';
  if (k==='e3') bar = '<div class="hpbar"><span>18<small>&nbsp;/ 24</small></span><u></u></div>';
  if (k==='e4') { var t=''; for (var i=4;i<24;i+=4) t+='<span class="tk" style="left:'+(i/24*100)+'%"></span>'; bar = '<div class="hpbar"><u style="width:75%"></u>'+t+'</div>'; }
  if (k==='e5') return '<div class="hero h5">'+h+'<div class="hpmid" style="flex:1"><div class="hpbar"><u style="width:75%"></u></div><div class="ends"><b>18</b><span>24</span></div></div>'+abil+'</div>';
  if (k==='e6') return '<div class="hero h6">'+h+'<div class="hpmid"><div class="hpbar"><u style="width:75%"></u></div>'+num+'</div>'+abil+'</div>';
  if (k==='e7') return '<div class="hero h7">'+h.replace('<svg','<svg style="display:none"')+'<div class="hpmid">'+IC.heart.replace('<svg','<svg style="width:18px;height:18px;flex:none;fill:var(--r)"')+bar+num+'</div>'+abil+'</div>';
  var hn = (k==='e1'||k==='e4') ? num : '';
  return '<div class="hero h'+k.slice(1)+'">'+h+bar+hn+abil+'</div>';
}
function mockup(v){
  var cols = 5, rows = 3;
  var en = ENEMIES.slice();
  var h = '<div class="m va '+v.key+'" style="--cols:5">';
  h += '<div class="hd"><button class="hb" aria-label="Back">'+IC.back+'</button><div class="ttl">Mesa<small>Fight 3 of 5</small></div><button class="hb" aria-label="Menu">'+IC.menu+'</button></div>';
  h += '<div class="hint">Tap a tile to see what it reaches.</div>';
  h += '<div class="enemies" style="align-items:start">'+en.map(function(e){return enemyHTML(e,v.key);}).join('')+'</div>';
  h += '<div class="boardwrap"><div class="board" data-cols="5" data-rows="3">';
  var occ = {};
  BOARD.forEach(function(t){ (t.cells||[[0,0]]).forEach(function(p){ occ[(t.r+p[0])+','+(t.c0+p[1])]=1; }); });
  for (var r=0;r<rows;r++) for (var c=0;c<cols;c++){
    var blocked = BLOCKED.some(function(b){return b[0]===r&&b[1]===c;});
    if (occ[r+','+c]) continue;
    h += '<div class="cell'+(blocked?' x':'')+'" data-r="'+r+'" data-c="'+c+'" style="grid-row:'+(r+1)+';grid-column:'+(c+1)+'"></div>';
  }
  BOARD.forEach(function(t){ h += tileHTML(t); });
  h += '</div></div>';
  h += '<div class="goals">'+GOALS.map(function(g){return '<span class="goal'+(g.on?' live':'')+'">'+IC.star+g.t+'</span>';}).join('')+'</div>';
  h += hero(v.key);
  h += '<div class="hand">';
  for (var i=0;i<10;i++) h += i<HAND.length ? '<div class="slot">'+tileHTML(HAND[i])+'</div>' : '<div class="slot empty"></div>';
  h += '</div>';
  h += '<div class="bar"><button class="clear">Clear</button><button class="go">Attack<small>34</small></button></div>';
  return h+'</div>';
}
/* ===== build page ===== */
var tabs = document.getElementById('tabs'), panels = document.getElementById('panels');
VARS.forEach(function(v,i){
  var b = document.createElement('button'); b.textContent = v.tab; b.setAttribute('role','tab'); b.setAttribute('aria-selected', i===0); b.dataset.k = v.key;
  b.onclick = function(){ show(v.key); }; tabs.appendChild(b);
  var p = document.createElement('section'); p.className='panel'; p.id='p-'+v.key; p.hidden = i!==0;
  p.innerHTML = '<div class="ptitle"><b>'+v.tab+' · '+v.title+'</b> — '+v.sub+'</div>' + mockup(v) + '<div class="notes">'+v.notes.map(function(n){return '<p>'+n+'</p>';}).join('')+'</div>';
  panels.appendChild(p);
});
function show(k){
  [].forEach.call(tabs.children, function(b){ b.setAttribute('aria-selected', b.dataset.k===k); });
  [].forEach.call(panels.children, function(p){ p.hidden = p.id!=='p-'+k; });
  history.replaceState(null,'','#'+k);
}
if (/^#e[1-7]$/.test(location.hash)) show(location.hash.slice(1));
/* tap a board tile to highlight what it reaches */
panels.addEventListener('click', function(e){
  var t = e.target.closest('.tile'); var m = e.target.closest('.m'); if (!m) return;
  var was = t && t.classList.contains('sel');
  [].forEach.call(m.querySelectorAll('.sel,.aff,.tgt'), function(x){ x.classList.remove('sel','aff','tgt'); });
  if (!t || was || !t.dataset.id) return;
  var d = BOARD.filter(function(b){return b.id===t.dataset.id;})[0]; if (!d) return;
  t.classList.add('sel');
  var w = d.w||1, cols = [];
  var cellAt = function(r,c){ return m.querySelector('.cell[data-r="'+r+'"][data-c="'+c+'"]') || [].filter.call(m.querySelectorAll('.board .tile[data-id]'), function(x){ var b=BOARD.filter(function(q){return q.id===x.dataset.id;})[0]; return b.r===r && c>=b.c0 && c<b.c0+(b.w||1); })[0]; };
  if (d.k==='a' || d.lane){
    var cs=[]; if (!d.reach || d.reach.indexOf('f')>=0 || d.lane) for (var j=0;j<w;j++) cs.push(d.c0+j);
    if (d.k==='a' && d.reach.indexOf('l')>=0) cs.push(d.c0-1);
    if (d.k==='a' && d.reach.indexOf('r')>=0) cs.push(d.c0+w);
    [].forEach.call(m.querySelectorAll('.enemy'), function(en){ var c0=+en.dataset.c, ew=+en.dataset.w; if (cs.some(function(c){return c>=c0&&c<c0+ew;})) en.classList.add('tgt'); });
  }
  if (d.k!=='a'){
    var r=d.reach, tg=[];
    if (r.indexOf('u')>=0) for (var j2=0;j2<w;j2++) tg.push([d.r-1,d.c0+j2]);
    if (r.indexOf('d')>=0) for (var j3=0;j3<w;j3++) tg.push([d.r+1,d.c0+j3]);
    if (r.indexOf('l')>=0) tg.push([d.r,d.c0-1]);
    if (r.indexOf('r')>=0) tg.push([d.r,d.c0+w]);
    tg.forEach(function(p){ var el = cellAt(p[0],p[1]); if (el) el.classList.add('aff'); });
  }
});
</script>
