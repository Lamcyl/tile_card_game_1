<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tile Run - units page, Split with team markers</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>
:root{color-scheme:light dark;
 --bg:#eef1f5;--panel:#ffffff;--panel2:#e4e9f0;--ink:#1c2635;--muted:#566377;--line:#c9d1dc;--cellbg:#f8fafc;
 --r:#d2473f;--b:#2e6bd3;--g:#23874f;--y:#b9800f;--p:#7a55c2;--x:#566377;
 --ok:#1b8a4a;--btn:#1c2635;--btnink:#ffffff;--shadow:rgba(20,30,50,.18);--gold:#e0a100;--shard:#2f9fd0;
 --rare:#1596b8;--epic:#c235b8;--com:#8a94a6}
@media (prefers-color-scheme: dark){:root{
 --bg:#151a24;--panel:#212838;--panel2:#2b3448;--ink:#eef2f8;--muted:#a6b1c4;--line:#3a4560;--cellbg:#1b2130;
 --r:#e0584f;--b:#4f86e6;--g:#2f9d5f;--y:#d19a22;--p:#9a78e0;--x:#7a879c;
 --ok:#4cc27c;--btn:#eef2f8;--btnink:#151a24;--shadow:rgba(0,0,0,.5);--gold:#f0b429;--shard:#5bc0ee;
 --rare:#35c3e6;--epic:#e056d8;--com:#7a879c}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:440px;margin:0 auto;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:0;cursor:pointer}
#tabs{display:flex;gap:4px;padding:6px 8px 0;flex:none}
#tabs button{flex:1;height:36px;border-radius:10px;font-size:12px;font-weight:800;line-height:1.05;padding:0 2px;box-shadow:0 2px 0 var(--shadow)}
#tabs button[aria-selected=true]{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
#desc{flex:none;padding:5px 14px 4px;font-size:11px;line-height:1.3;color:var(--muted);height:36px;overflow:hidden}
#desc b{color:var(--ink)}
#app{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:0 12px 10px;position:relative}
.hd{display:flex;align-items:center;gap:6px;height:44px;flex:none}
.hd h1{margin:0;font-size:21px;letter-spacing:-.02em;flex:1}
.back{width:44px;height:44px;border:0;border-radius:14px;box-shadow:0 2px 0 var(--shadow);display:flex;align-items:center;justify-content:center}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cur{display:flex;align-items:center;gap:5px;height:32px;padding:0 10px;border-radius:16px;background:var(--panel);box-shadow:0 2px 0 var(--shadow);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.cur::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--gold)}.cur.sh::before{border-radius:3px;transform:rotate(45deg);background:var(--shard);width:10px;height:10px}
.seg{display:flex;gap:4px;padding:3px;background:var(--panel2);border-radius:14px;flex:none}
.seg button{flex:1;height:44px;border:0;border-radius:11px;background:transparent;font-size:13px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.seg button small{font-size:10px;font-weight:700;opacity:.85}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 2px 0 var(--shadow)}
.ct{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;flex:none}
.ct button{height:44px;border-radius:12px;box-shadow:0 2px 0 var(--shadow);display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:800;border-width:2px;padding:0}
.ct button .dot{width:20px;height:20px;border-radius:7px;background:var(--cc);color:#fff;display:flex;align-items:center;justify-content:center}
.ct button .dot svg{width:12px;height:12px;fill:currentColor}
.ct button.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--panel))}
.ct button small{font-weight:700;color:var(--muted);font-size:11px}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px}
/* tiles */
.tl{display:block;flex:none;overflow:visible}
.tl text{font-weight:800;font-family:inherit;text-anchor:middle;pointer-events:none}
.tg{display:inline-flex;align-items:center;gap:4px}
/* rarity / state */
.u{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:12px;box-shadow:0 2px 0 var(--shadow);text-align:left;cursor:pointer;overflow:hidden}
.u.r0{--rc:var(--com)}.u.r1{--rc:var(--rare)}.u.r2{--rc:var(--epic)}
.u .rs{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--rc)}
.u.r2 .rs{box-shadow:0 0 6px var(--epic)}
.u.sel{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 12%,var(--panel))}
.u.no{opacity:.62}.u.no .tl{filter:grayscale(.7)}
.nm{font-weight:800;font-size:14px;letter-spacing:-.01em;display:flex;align-items:center;gap:4px;white-space:nowrap}
.sub{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.sub b{color:var(--rc);font-weight:800}
.lk{width:12px;height:12px;stroke:var(--muted);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* slot pips */
.sp{display:inline-flex;gap:4px;align-items:center}
.pp{width:20px;height:20px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;position:relative}
.pp.cl{border:2px dashed var(--line);color:var(--muted)}
.pp.op{border:2px dashed var(--cc);background:color-mix(in srgb,var(--cc) 12%,transparent)}
.pp svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}
.pp.fl{padding:0;border:0;background:none}
.sp.bigp .pp{width:50px;height:50px;border-radius:13px}.sp.bigp .pp svg{width:18px;height:18px}.sp.smp{gap:3px}.sp.smp .pp{width:16px;height:16px;border-radius:5px}.sp.smp .pp svg{width:9px;height:9px}
.sp .pp.fl svg,.sp.bigp .pp.fl svg,.sp.smp .pp.fl svg{width:100%;height:100%;stroke:none}
/* detail + buttons */
.det{flex:none;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:7px 10px 8px;box-shadow:0 2px 0 var(--shadow);display:flex;flex-direction:column;gap:6px}
.fx{font-size:12px;line-height:1.28;color:var(--muted);min-height:31px}.fx b{color:var(--ink);font-size:13px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.ab{height:44px;border-radius:12px;font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;box-shadow:0 2px 0 var(--shadow)}
.ab small{font-size:10px;font-weight:700;color:var(--muted)}
.ab.pri{background:var(--btn);color:var(--btnink);border-color:var(--btn)}.ab.pri small{color:inherit;opacity:.75}
.ab:disabled{opacity:.4;box-shadow:none}
.toast{position:absolute;left:12px;right:12px;bottom:14px;background:var(--btn);color:var(--btnink);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;text-align:center;z-index:20}
.lvb{display:inline-flex;gap:2px;vertical-align:middle}.lvb i{width:9px;height:4px;border-radius:2px;background:var(--line)}.lvb i.on{background:var(--cc)}
/* split */
.split{flex:1;min-height:0;display:flex;gap:9px}
.rail{flex:none;width:106px;display:flex;flex-direction:column;gap:5px}
.rail .u{flex:1 1 0;min-height:44px;padding:5px 6px 5px 7px;display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:visible;border:2px solid var(--rc);border-radius:11px;width:100%}
.rail .u.r0{--rc:var(--line)}
.rail .u.r2{box-shadow:0 0 6px color-mix(in srgb,var(--epic) 55%,transparent),0 2px 0 var(--shadow)}
.rail .u.sel{background:color-mix(in srgb,var(--cc) 16%,var(--panel));box-shadow:0 0 0 2px var(--cc),0 2px 0 var(--shadow)}
.rail .u.sel::after{content:"";position:absolute;right:-12px;top:50%;margin-top:-7px;border:7px solid transparent;border-left:8px solid var(--cc);border-right:0}
.rail .u.r0 .sub b,.big.r0 .sub b{color:var(--com)}
.rail .u .nm{font-size:13px;gap:5px;justify-content:space-between}
.rail .u .nm .t{display:inline-flex;align-items:center;gap:5px;min-width:0}
.rail .u .sub{font-size:10px;display:flex;justify-content:space-between;align-items:center;gap:4px}
.rail .u .mt{display:block;height:20px}
.rail .u.no{border-style:dashed}
.dots{display:inline-flex;gap:3px}.dots i{width:8px;height:8px;border-radius:3px;border:1.5px dashed var(--muted);opacity:.7}
.dots i.o{border-color:var(--cc);opacity:1}.dots i.f{background:var(--cc);border:0;opacity:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.main .big{flex:1}
.sock{display:flex;gap:6px}
.sock .pp{width:48px;height:48px;border-radius:12px}.sock .pp svg{width:18px;height:18px}
.big{flex:1;min-height:0;background:var(--panel);border:2px solid var(--cc);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:9px;box-shadow:0 3px 0 var(--shadow);position:relative;overflow:hidden}
.big.no{opacity:1}.big.no .tl{filter:grayscale(.7)}
.big .bh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;row-gap:3px}.big .bh .nm{font-size:20px}
.rp{font-size:10px;font-weight:800;border:2px solid var(--rc);border-radius:9px;padding:0 6px;line-height:15px;color:var(--ink);background:var(--panel)}
.big.r2 .rp{box-shadow:0 0 6px color-mix(in srgb,var(--epic) 55%,transparent)}
.big.r0{--rc:var(--line)}
/* marker A: filled TEAM badge */
.mkA{font-size:9px;font-weight:900;letter-spacing:.06em;background:var(--cc);color:#fff;border-radius:6px;padding:0 5px;line-height:14px;flex:none}
.mkA.lg{font-size:11px;line-height:18px;padding:0 8px;border-radius:9px}
/* marker B: whole entry filled with the colour */
.rail .u.team.vB{background:var(--cc);color:#fff;border-color:var(--cc)}
.rail .u.team.vB .nm,.rail .u.team.vB .sub,.rail .u.team.vB .sub b{color:#fff}
.rail .u.team.vB .dots i{border-color:#fff;opacity:.8}.rail .u.team.vB .dots i.f{background:#fff;border:0}
.rail .u.team.vB .mt{background:var(--panel);border-radius:6px;padding:1px 3px;height:22px;width:max-content;max-width:100%}
.rail .u.team.vB.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--cc),0 2px 0 var(--shadow)}
.rail .u.team.vB.sel::after{right:-14px}
.bandB{margin:-10px -12px 0;background:var(--cc);color:#fff;padding:0 12px;height:24px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:900;letter-spacing:.08em}
.bandB svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
/* marker C: radio seat */
.seat{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;background:transparent}
.seat svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.seat.on{background:var(--cc);border-color:var(--cc)}
.seat.no{border-style:dashed;border-color:var(--line);color:var(--muted)}
.seat.lg{width:24px;height:24px}.seat.lg svg{width:14px;height:14px}
.seatl{font-size:11px;font-weight:800;color:var(--muted);display:inline-flex;align-items:center;gap:5px}.seatl.on{color:var(--cc)}
</style>
</head>

 var txt=(t.k==='x'?'×':t.k==='p'?'+':'')+(lab!==undefined?lab:lvl(t,L||1));
 body+='<text x="'+(best[1]*P+(first?24:20))+'" y="'+(best[0]*P+29)+'" font-size="'+(txt.length>2?16:22)+'" fill="'+(solid?'#fff':fill)+'">'+txt+'</text>';
 if(u>=15){var li=lit(t),gc=solid?'#fff':fill,s0=4.6,g=1.2;for(var r=0;r<3;r++)for(var c=0;c<3;c++){var own=r===1&&c===1,on=li[r+','+c];body+=own?'<rect x="'+(4.2+c*(s0+g))+'" y="'+(4.2+r*(s0+g))+'" width="'+s0+'" height="'+s0+'" rx="1" fill="none" stroke="'+gc+'" stroke-width="1"/>':'<rect x="'+(4.2+c*(s0+g))+'" y="'+(4.2+r*(s0+g))+'" width="'+s0+'" height="'+s0+'" rx="1" fill="'+gc+'" opacity="'+(on?1:.3)+'"/>'}}
 return '<svg class="tl" viewBox="0 0 '+W*P+' '+H*P+'" width="'+W*u+'" height="'+H*u+'" aria-hidden="true">'+body+'</svg>'}
/* the 3 base tiles of a unit; scaled so they fit maxW x maxH */
function tiles(u,cs,maxH,maxW,gap){var cc=0;u.toks.forEach(function(t){cc+=SHC[t.sh].reduce(function(m,p){return Math.max(m,p[1]+1)},0)});gap=gap===undefined?4:gap;
 var us=cs;if(maxW){us=Math.min(cs,Math.floor((maxW-2*gap)/cc))}
 return '<span class="tg" style="gap:'+gap+'px">'+u.toks.map(function(t){return tileSVG(t,u.c,us,maxH,u.lvl||1)}).join('')+'</span>'}
var LOCK='<svg viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12v9H6z"/></svg>',PLUS='<svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>';
function pips(u,big,sm){return '<span class="sp'+(big?' bigp':'')+(sm?' smp':'')+'">'+u.slots.map(function(s){return s==='cl'?'<span class="pp cl" title="closed slot">'+LOCK+'</span>':s==='op'?'<span class="pp op" title="open slot">'+PLUS+'</span>':'<span class="pp fl" title="holds a tile">'+tileSVG({k:'a',n:s.n,d:'^',sh:'o'},s.c,big?50:20,0,1,s.n)+'</span>'}).join('')+'</span>'}
var LK='<svg class="lk" viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12v9H6z"/></svg>';
function sub(u){return '<span class="sub"><b>'+RAR[u.rar]+'</b> &middot; '+(u.own?'Lv '+u.lvl:'not owned')+'</span>'}
function ucls(u,extra){return 'u r'+u.rar+(u.own?'':' no')+(S.sel[u.c]===u.i?' sel':'')+(extra?' '+extra:'')}
function ub(u,extra,inner){return '<button class="'+ucls(u,extra)+'" style="--cc:var(--'+u.c+')" data-c="'+u.c+'" data-i="'+u.i+'" aria-label="'+u.name+', '+RAR[u.rar]+(u.own?', level '+u.lvl:', not owned')+(u.team?', in team':'')+'"><i class="rs"></i>'+inner+'</button>'}
function cur(){return U[S.col]}
function selU(){return U[S.col][S.sel[S.col]]}
function header(){return '<div class="hd"><button class="back" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h1>Team</h1><span class="cur">'+S.coins.toLocaleString()+'</span><span class="cur sh">'+S.shards+'</span></div>'}
function seg(){return '<div class="seg" role="tablist" aria-label="Team sections"><button class="on" role="tab" aria-selected="true">Units</button><button data-go="Recruit">Recruit<small>1 free pull</small></button><button data-go="Collected tiles">Collected<small>23 tiles</small></button><button data-go="Colourless bag">Colourless<small>3 of 3</small></button></div>'}
function ctabs(){return '<div class="ct">'+CS.map(function(c){var o=U[c].filter(function(u){return u.own}).length;return '<button class="'+(c===S.col?'on':'')+'" style="--cc:var(--'+c+')" data-col="'+c+'" aria-label="'+CN[c]+' units"><span class="dot"><svg viewBox="0 0 10 10">'+SYM[c]+'</svg></span><small>'+o+'/'+N+'</small></button>'}).join('')+'</div>'}
function detail(u){var e=EFF[u.fx],mx=[1,2,3][u.rar],op=u.slots.filter(function(s){return s!=='cl'}).length,full=op>=mx;
 var h='<div class="det" style="--cc:var(--'+u.c+')"><div class="fx"><b>'+e[0]+'</b> &middot; '+e[1]+'</div>';
 if(!u.own)h+='<div class="acts"><button class="ab pri" style="grid-column:1/-1" data-go="Recruit">Not owned - find in Recruit</button></div>';
 else h+='<div class="acts"><button class="ab'+(u.team?'':' pri')+'" data-act="pick"'+(u.team?' disabled':'')+'>'+(u.team?'In team':'Pick')+'<small>'+(u.team?'one per colour':'for team')+'</small></button><button class="ab" data-act="lvl"'+(u.lvl>=5?' disabled':'')+'>'+(u.lvl>=5?'Max level':'Level up')+'<small>'+(u.lvl>=5?'Lv 5':'◆ '+(30+u.lvl*20))+'</small></button><button class="ab" data-go="Loadout">Loadout<small>'+op+' of '+mx+' slots</small></button><button class="ab" data-act="slot"'+(full?' disabled':'')+'>Buy slot<small>'+(full?'all open':(150*(op+1))+' coins')+'</small></button></div>';
 return h+'</div>'}
var CHK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.500"/></svg>';
var VAR='A';
function lvbar(u){var s='';for(var i=1;i<=5;i++)s+='<i'+(i<=u.lvl?' class="on"':'')+'></i>';return '<span class="lvb" style="--cc:var(--'+u.c+')">'+s+'</span>'}
function dots(u){return '<span class="dots">'+u.slots.map(function(s){return '<i class="'+(s==='cl'?'':s==='op'?'o':'f')+'"></i>'}).join('')+'</span>'}
function rbtn(u){var sel=S.sel[u.c]===u.i,seat='',badge='',lock=(!u.own?LK:'');
 if(VAR==='A'&&u.team)badge='<span class="mkA">TEAM</span>';
 if(VAR==='C')seat='<span class="seat'+(u.team?' on':u.own?'':' no')+'">'+(u.team?CHK:'')+'</span>';
 var subt='<b>'+RAR[u.rar]+'</b>'+(u.own?' · L'+u.lvl:'');
 if(VAR==='B'&&u.team)subt='<b>IN TEAM</b> · L'+u.lvl;
 if(!u.own)subt='<b>'+RAR[u.rar]+'</b> · locked';
 return '<button class="u r'+u.rar+(u.own?'':' no')+(sel?' sel':'')+(u.team?' team':'')+' v'+VAR+'" style="--cc:var(--'+u.c+')" data-c="'+u.c+'" data-i="'+u.i+'" aria-label="'+u.name+', '+RAR[u.rar]+(u.own?', level '+u.lvl:', not owned')+(u.team?', in team':'')+(sel?', viewing':'')+'">'+
  '<span class="nm"><span class="t">'+seat+u.name+lock+'</span>'+badge+'</span>'+
  '<span class="sub"><span>'+subt+'</span>'+(u.own?dots(u):'')+'</span>'+
  '<span class="mt">'+tiles(u,10,18,90,2)+'</span></button>'}
function teamMark(u){
 if(VAR==='A')return u.team?'<span class="mkA lg">IN TEAM</span>':'';
 if(VAR==='C')return u.own?'<span class="seatl'+(u.team?' on':'')+'"><span class="seat lg'+(u.team?' on':'')+'">'+(u.team?CHK:'')+'</span>'+(u.team?'In team':'Not in team')+'</span>':'';
 return ''}
function bigCard(u0){var e=EFF[u0.fx],op=u0.slots.filter(function(s){return s!=='cl'}).length,mxs=[1,2,3][u0.rar],full=op>=mxs,nx=150;
 var cost=20*(op+1);
 var acts=u0.own?'<div class="acts" style="grid-template-columns:1fr 1fr;margin-top:auto">'+
  '<button class="ab'+(u0.team?'':' pri')+'" data-act="pick"'+(u0.team?' disabled':'')+'>'+(u0.team?'In team':'Pick')+'<small>'+(u0.team?'one per colour':'for the team')+'</small></button>'+
  '<button class="ab" data-act="lvl"'+(u0.lvl>=5?' disabled':'')+'>'+(u0.lvl>=5?'Max level':'Level up')+'<small>'+(u0.lvl>=5?'Lv 5':(100*u0.lvl)+' coins')+'</small></button>'+
  '<button class="ab" data-go="Loadout">Loadout<small>'+op+' of '+mxs+' slots</small></button>'+
  '<button class="ab" data-act="slot"'+(full?' disabled':'')+'>Buy slot<small>'+(full?'all open':cost+' shards')+'</small></button></div>'
  :'<div class="acts" style="margin-top:auto"><button class="ab pri" style="grid-column:1/-1" data-go="Recruit">Find in Recruit</button></div>';
 return '<div class="big u r'+u0.rar+(u0.own?'':' no')+'" style="--cc:var(--'+u0.c+')">'+
  (VAR==='B'&&u0.team?'<div class="bandB">'+CHK+'IN TEAM</div>':'')+
  '<div class="bh"><span class="nm">'+u0.name+'</span><span class="rp">'+RAR[u0.rar]+'</span>'+(u0.own?'<span class="sub" style="margin-left:auto;display:inline-flex;align-items:center;gap:5px">'+lvbar(u0)+'Lv '+u0.lvl+'</span>':'<span class="sub" style="margin-left:auto">not owned</span>')+'</div>'+
  (teamMark(u0)?'<div style="margin-top:-3px">'+teamMark(u0)+'</div>':'')+
  tiles(u0,46,90,195,6)+
  '<div><div class="sub" style="margin-bottom:4px">Slots &middot; '+op+' of '+mxs+' open</div><div class="sock">'+pips(u0,1)+'</div></div>'+
  '<div class="fx"><b>'+e[0]+'</b> &middot; '+e[1]+'</div>'+acts+'</div>'}
function page(){var u0=selU();
 return header()+seg()+ctabs()+'<div id="stage"><div class="split"><div class="rail">'+cur().map(rbtn).join('')+'</div><div class="main">'+bigCard(u0)+'</div></div></div>'}
var TABS=[
 {k:'A Badge',v:'A',a:'Team unit carries a solid colour TEAM badge. Viewed unit: tinted fill, colour outline, pointer to the card.',b:'Cost: the badge is small; the rail row needs the width.'},
 {k:'B Filled',v:'B',a:'Team unit is filled solid in its colour, like a game tile. Viewed unit: tinted fill, outline and pointer.',b:'Cost: loudest, five filled rows would shout; tile minis sit on a white strip.'},
 {k:'C Seat',v:'C',a:'Every owned unit has a radio seat: empty ring, or a filled check for the team pick. Viewed unit: tinted fill and pointer.',b:'Cost: a little more UI, but it reads as pick-one at once, and carries over to the big card.'}];
function render(){var t=TABS[S.tab];VAR=t.v;$('#app').innerHTML=page()+(S.toast?'<div class="toast">'+S.toast+'</div>':'');
 $('#tabs').innerHTML=TABS.map(function(x,i){return '<button role="tab" aria-selected="'+(i===S.tab)+'" data-t="'+i+'">'+x.k+'</button>'}).join('');
 $('#desc').innerHTML='<b>Idea:</b> '+t.a+'<br><b>Cost:</b> '+t.b.slice(6)}
var tt;function toast(m){S.toast=m;render();clearTimeout(tt);tt=setTimeout(function(){S.toast='';render()},1600)}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 if(b.dataset.t!==undefined){S.tab=+b.dataset.t;S.toast='';render();return}
 if(b.dataset.col){S.col=b.dataset.col;render();return}
 if(b.dataset.i!==undefined&&b.dataset.c){S.col=b.dataset.c;S.sel[S.col]=+b.dataset.i;render();return}
 if(b.dataset.go){toast(b.dataset.go+' opens its own screen (not mocked)');return}
 var u=selU();
 if(b.dataset.act==='pick'){U[S.col].forEach(function(q){q.team=false});u.team=true;render()}
 if(b.dataset.act==='lvl'&&u.lvl<5){S.coins=Math.max(0,S.coins-100*u.lvl);u.lvl++;render()}
 if(b.dataset.act==='slot'){var k=u.slots.indexOf('cl');if(k>=0){u.slots[k]='op';S.shards=Math.max(0,S.shards-20*(u.slots.filter(function(s){return s!=='cl'}).length));render()}}
});
render();
</script>
